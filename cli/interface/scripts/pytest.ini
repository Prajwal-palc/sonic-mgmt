[pytest]
# Pytest Configuration for Interface CLI Testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = .

# Markers
markers =
    show_commands: Tests for show commands
    config_commands: Tests for configuration commands
    interface_config: Tests for interface configuration
    negative: Negative test cases
    mtu: MTU configuration tests
    description: Description configuration tests
    shutdown: Shutdown/enable tests
    workflow: Combined workflow tests
    creation: Tests for interface creation commands
    update_commands: Tests for interface update commands
    delete_commands: Tests for interface deletion commands
    recreation: Tests for interface recreation workflows
    device1: Tests for device 192.168.100.97
    device2: Tests for device 192.168.100.142

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --html=../results/pytest_report_final.html
    --self-contained-html
    --capture=no

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = ../logs/pytest_execution.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Coverage (optional)
# addopts = --cov=. --cov-report=html

# Timeout (if pytest-timeout is installed)
# timeout = 300

# Parallel execution (if pytest-xdist is installed)
# addopts = -n auto

[pytest]
# Enhanced Pytest Configuration for NTP CLI Tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = .

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider
    --html=/home/adminuser/draksha/ntp/cli/results/pytest_html_report.html
    --self-contained-html

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = /home/adminuser/draksha/cli/ntp/logs/pytest_execution.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Markers
markers =
    global_config: NTP global configuration tests
    authentication: NTP authentication tests
    auth_keys: NTP authentication key tests
    trusted_keys: NTP trusted key tests
    servers: NTP server configuration tests
    source_interface: NTP source interface tests
    vrf: NTP VRF configuration tests
    show_commands: NTP show command tests
    complex: Complex NTP configuration scenarios

# Timeout
timeout = 600

# Console output
console_output_style = progress

[pytest]
# Pytest Configuration for Static Route CLI Tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = scripts

# Markers
markers =
    ipv4: IPv4 static route tests
    ipv6: IPv6 static route tests
    vrf: VRF-based route tests
    blackhole: Blackhole route tests
    deletion: Route deletion tests
    interface: Interface-based route tests
    nexthop_vrf: Next-hop VRF route tests
    update: Route update tests
    recreation: Route recreation tests
    slow: Slow running tests
    smoke: Smoke tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest_execution.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider

# HTML Report
htmlpath = results/pytest_report_final.html

# JSON Report
jsonpath = results/test_results.json

# Timeout
timeout = 300

# Console output
console_output_style = progress

# Minimum Python version
minversion = 3.8

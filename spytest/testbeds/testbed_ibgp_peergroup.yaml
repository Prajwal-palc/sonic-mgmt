version: 2.0

devices:
  sonic1:
    device_type: sonic
    access:
      protocol: ssh
      ip: 192.168.100.196
      port: 22
    credentials:
      username: admin
      password: YourPaSsWoRd
      altpassword: YourPaSsWoRd
    properties:
      alias: DUT1
      type: sonic
      platform: broadcom

  sonic2:
    device_type: sonic
    access:
      protocol: ssh
      ip: 192.168.100.55
      port: 22
    credentials:
      username: admin
      password: YourPaSsWoRd
      altpassword: YourPaSsWoRd
    properties:
      alias: DUT2
      type: sonic
      platform: broadcom

topology:
  sonic1:
    interfaces:
      Ethernet0:
        EndDevice: sonic2
        EndPort: Ethernet0
      Ethernet4:
        EndDevice: sonic2
        EndPort: Ethernet4

  sonic2:
    interfaces:
      Ethernet0:
        EndDevice: sonic1
        EndPort: Ethernet0
      Ethernet4:
        EndDevice: sonic1
        EndPort: Ethernet4

# Device Mapping
# --------------
# D1 (DUT1) = sonic1 (192.168.100.196)
# D2 (DUT2) = sonic2 (192.168.100.55)
#
# Connections:
# - Ethernet4 on sonic1 <-> Ethernet4 on sonic2 (used for iBGP peer-group test)
#
# BGP Configuration:
# - sonic1 (DUT1): AS 65001, Router-ID 1.1.1.1, IP 10.1.1.1/24
# - sonic2 (DUT2): AS 65001, Router-ID 2.2.2.2, IP 10.1.1.2/24, Peer-Group "1"

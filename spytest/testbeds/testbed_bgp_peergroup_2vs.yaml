# Testbed Configuration for BGP Peer Group Test
# Author: Athira
# © 2025, copyrights@SuperMicro
#
# Topology: 2 Virtual SONiC Switches (VS)
# Purpose: BGP Peer Group Configuration and Validation
#
# Device Details:
#   DUT1: 192.168.100.196 (smic_sonic1)
#   DUT2: 192.168.100.82 (smic_sonic2)

version: 2.0

devices:
  smic_sonic1:
    device_type: sonic
    access: {protocol: ssh, ip: 192.168.100.196, port: 22}
    credentials: {username: admin, password: YourPaSsWoRd, altpassword: YourPaSsWoRd}
    properties: {services: default, build: default, config: default, errors: default}

  smic_sonic2:
    device_type: sonic
    access: {protocol: ssh, ip: 192.168.100.82, port: 22}
    credentials: {username: admin, password: YourPaSsWoRd, altpassword: YourPaSsWoRd}
    properties: {services: default, build: default, config: default, errors: default}

topology:
  smic_sonic1:
    interfaces:
      Ethernet0: {EndDevice: smic_sonic2, EndPort: Ethernet0}

  smic_sonic2:
    interfaces:
      Ethernet0: {EndDevice: smic_sonic1, EndPort: Ethernet0}

services: {default: {}}
builds:   {default: {}}
configs:  {default: {}}
errors:   {default: {}}
params:   {}

# Topology Diagram:
# +-------------------------+                       +-------------------------+
# |    smic_sonic1 (DUT1)   |                       |    smic_sonic2 (DUT2)   |
# | Eth0 10.1.1.1/24        |=======================| Eth0 10.1.1.2/24        |
# | AS 100                  |                       | AS 200                  |
# | (192.168.100.196)       |                       | (192.168.100.82)        |
# +-------------------------+                       +-------------------------+
#
# BGP Configuration:
#   - DUT1: AS 100, Router-ID 1.1.1.1
#   - DUT2: AS 200, Router-ID 2.2.2.2
#   - eBGP session over Ethernet0 (physically connected port)
#   - Peer group "PG_EXTERNAL" on DUT1

# D-Link 2 Node Testbed Configuration
# Topology: D1 (DUT) <--> D2
# Connection: Two back-to-back links

version: 2.0

devices:
  D1:
    device_type: sonic
    access:
      protocol: ssh
      ip: 192.168.100.220
      port: 22
    credentials:
      username: admin
      password: sonic@123
      altpassword: YourPaSsWoRd
    properties: {services: default, build: default, config: default, errors: default}

  D2:
    device_type: sonic
    access:
      protocol: ssh
      ip: 192.168.100.140
      port: 22
    credentials:
      username: admin
      password: broadcom
      altpassword: YourPaSsWoRd
    properties: {services: default, build: default, config: default, errors: default}

topology:
  D1:
    interfaces:
      Ethernet48:
        EndDevice: D2
        EndPort: Ethernet80
      Ethernet52:
        EndDevice: D2
        EndPort: Ethernet88

  D2:
    interfaces:
      Ethernet80:
        EndDevice: D1
        EndPort: Ethernet48
      Ethernet88:
        EndDevice: D1
        EndPort: Ethernet52

services: {default: {name: default}}
builds:   {default: {name: default}}
configs:  {default: {name: default}}
errors:   {default: {}}
params:   {}

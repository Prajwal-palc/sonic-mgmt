# SM_ISCLI_22 Test Variables
# Test configuration for management interface name display in running-config

defaults:
  cli_type: klish
  verify_timeout: 10
  cleanup: true

testcases:
  "22.1":
    title: "Management interface name display - IPv4"
    test_type: "basic"
    management_ip: "172.31.51.147/16"
    ip_version: "ipv4"
    expected_interface_name: "Management0"
    not_expected_name: "eth0"
    expected:
      - contains: "interface Management0"
        not_contains: "interface eth0"

  "22.2":
    title: "Management interface name display - IPv6"
    test_type: "basic"
    management_ip: "2001:db8:1::10/64"
    ip_version: "ipv6"
    expected_interface_name: "Management0"
    not_expected_name: "eth0"
    expected:
      - contains: "interface Management0"
        not_contains: "interface eth0"

  "22.3":
    title: "Management interface name display - Both IPv4 and IPv6"
    test_type: "basic"
    management_ipv4: "172.31.51.147/16"
    management_ipv6: "2001:db8:1::10/64"
    expected_interface_name: "Management0"
    not_expected_name: "eth0"
    expected:
      - contains: "interface Management0"
        not_contains: "interface eth0"

  "22.4":
    title: "Running-config persistence after save"
    test_type: "basic"
    management_ip: "172.31.51.150/16"
    ip_version: "ipv4"
    expected_interface_name: "Management0"
    not_expected_name: "eth0"
    expected:
      - contains: "interface Management0"
        not_contains: "interface eth0"

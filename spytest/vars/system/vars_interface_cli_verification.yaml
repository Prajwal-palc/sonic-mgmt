defaults:
  cli_type: klish
  verify_timeout: 30
  cleanup: true
  min_topology:
    - "D1"

testcases:
  "1.1":
    title: "Verify Interface Speed Options"
    interface: "Ethernet8"
    expected_speed_options:
      - "10"
      - "100"
      - "1000"
      - "2500"
      - "5000"
      - "10000"
      - "20000"
      - "25000"
      - "40000"
      - "50000"
      - "100000"
      - "200000"
      - "400000"
      - "800000"
      - "auto"
    expected_output_contains:
      - "<10/100/1000/2500/5000/10000/20000/25000/40000/50000/100000/200000/400000/800000>"
      - "Speed config of the interface"
      - "auto"
      - "Enable auto-negotiation"

  "2.1":
    title: "Verify IPv6 Disable State in Running Configuration"
    interface: "Ethernet8"
    ipv6_state: "disable"
    verify:
      ipv6_enable_present: false

  "2.2":
    title: "Verify IPv6 Enable State in Running Configuration"
    interface: "Ethernet8"
    ipv6_state: "enable"
    expected_config:
      - "interface Ethernet8"
      - "mtu 9100"
      - "speed auto"
      - "ipv6 enable"
    verify:
      ipv6_enable_present: true

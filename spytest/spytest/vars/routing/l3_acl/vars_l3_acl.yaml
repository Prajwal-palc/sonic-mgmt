  # TC L3-N06: Invalid TCP Flag Combinations (SYN+FIN)
  "L3-N06":
    title: "Invalid TCP flag combinations (SYN+FIN)"
    description: |
      Test validates ACL handling of malformed TCP packets with invalid flag combinations.
      SYN and FIN flags both set is invalid in normal TCP (SYN for connection init, FIN for close).
      Send crafted TCP packets with both flags set and verify ACL behavior.
      Expected result: Dropped or flagged as invalid (implementation-dependent).

    acl:
      tables:
        L3_ACL_TABLE_N06:
          type: "L3"

              action: "deny"
              protocol: "tcp"
              tcp_flags: "SF"             # SYN + FIN (invalid combination)
              src_ip: "any"
              dst_ip: "any"

            # Rule 2: PERMIT all other TCP
            - rule_name: "RULE_2_PERMIT_TCP"
              action: "permit"

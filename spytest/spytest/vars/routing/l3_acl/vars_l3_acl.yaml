################################################################################
# SpyTest Framework Settings
################################################################################

framework:
  # Silent pass prevention settings
  silent_pass_guards:
    - "tx_packets > 0"            # Guard 1: Stream must send packets
    - "rx_packets_verified"       # Guard 2: RX count must be from pcap file
    - "acl_evaluated"             # Guard 3: ACL rules must be evaluated

  # Tcpdump settings for verification
  tcpdump:
    enabled: true
    pcap_dir: "/tmp"              # Directory to store pcap files on DUT3
    filter: "udp port 54321"      # tcpdump filter expression
    timeout: 15                   # Seconds to wait after traffic stops

  # Test markers
  markers:
    - topology: "D1D2D3"
    - feature: "L3_ACL"
    - smoke: true
    - nightly: false

  # Cleanup settings
  cleanup:
    enabled: true
    remove_acl_after_test: true

  # Module config save - DISABLED to prevent prompt timeout errors
  # The spytest-helper.py --save-module-config command causes pattern match failures
  # on devices that are transitioning between CLI modes. Disabling this prevents
  # "Search pattern never detected" errors during post-test cleanup.
  config:
    save_config: false
    save_module_config: false
    restore_module_config: false
    remove_pcap_after_test: false  # Keep pcap files for debugging
    remove_acl_after_suite: true

################################################################################
# End of L3 ACL Test Variables
################################################################################

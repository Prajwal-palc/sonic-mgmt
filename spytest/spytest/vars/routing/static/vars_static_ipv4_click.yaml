defaults:
  cli_type: click
  verify_timeout: 30
  cleanup: true
  min_topology:
    - "D1D2:1"
  source_dut: "D1"
  peer_dut: "D2"

interfaces:
  D1:
    transit:
      name: "Ethernet32"
      prefix: "20.1.1.3/24"
  D2:
    transit:
      name: "Ethernet32"
      prefix: "20.1.1.4/24"
    edge:
      name: "Ethernet36"
      prefix: "30.1.1.3/24"

routes:
  primary:
    dut: "D1"
    destination: "30.1.1.0/24"
    next_hop: "20.1.1.4"
    vrf: null
    verify:
      ip_address: "30.1.1.0/24"
      type: "S"
      nexthop: "20.1.1.4"
  wrong_next_hop:
    dut: "D1"
    destination: "30.1.1.0/24"
    next_hop: "20.1.1.5"
    vrf: null

pings:
  edge:
    dut: "D1"
    target: "30.1.1.3"
    count: 4
    family: ipv4
  next_hop:
    dut: "D1"
    target: "20.1.1.4"
    count: 3
    family: ipv4

arp:
  next_hop_ip: "20.1.1.4"

testcases:
  TC-IP-STATIC-001:
    description: "Validate static route reachability via DUT2"
  TC-IP-STATIC-002:
    description: "Validate failure when static route is absent"
  TC-IP-STATIC-003:
    description: "Validate recovery when static route is restored"
  TC-IP-STATIC-004:
    description: "Validate failure when the next-hop interface is down"
  TC-IP-STATIC-005:
    description: "Validate behavior with incorrect next hop"
  TC-IP-STATIC-006:
    description: "Validate route persistence after reboot"
  TC-IP-STATIC-007:
    description: "Validate ARP/neighbor resolution for the next hop"
  TC-IP-STATIC-008:
    description: "Validate behavior while static route is removed during traffic"
  TC-IP-STATIC-009:
    description: "Validate no impact to local subnet reachability"
  TC-IP-STATIC-010:
    description: "Validate alternate static route target"
  TC-IP-STATIC-011:
    description: "Validate failure when DUT2 lacks the destination network"
  TC-IP-STATIC-012:
    description: "Validate route visibility in forwarding tables"

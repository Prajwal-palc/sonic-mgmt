version: 2.0
devices:
  # D1 - 192.168.100.234 (DUT1 - Primary device)
  smic_sonic1:
    device_type: sonic
    access: {protocol: ssh, ip: 192.168.100.234, port: 22}
    credentials: {username: admin, password: Ospf@123, altpassword: Ospf@123}
    properties: {services: default, build: default, config: default, errors: default}

  # D2 - 192.168.100.185 (DUT2 - Secondary device)
  smic_sonic2:
    device_type: sonic
    access: {protocol: ssh, ip: 192.168.100.185, port: 22}
    credentials: {username: admin, password: Ospf@123, altpassword: Ospf@123}
    properties: {services: default, build: default, config: default, errors: default}

topology:
  # D1 (smic_sonic1) connections - Only working interfaces
  smic_sonic1:
    interfaces:
      # D1 ↔ D2 Link 1
      Ethernet0: {EndDevice: smic_sonic2, EndPort: Ethernet0}
      # D1 ↔ D2 Link 2 (used for BGP tests)
      Ethernet4: {EndDevice: smic_sonic2, EndPort: Ethernet4}

  # D2 (smic_sonic2) connections - Only working interfaces
  smic_sonic2:
    interfaces:
      # D2 ↔ D1 Link 1
      Ethernet0: {EndDevice: smic_sonic1, EndPort: Ethernet0}
      # D2 ↔ D1 Link 2 (used for BGP tests)
      Ethernet4: {EndDevice: smic_sonic1, EndPort: Ethernet4}

services: {default: {}}
builds:   {default: {}}
configs:  {default: {}}
errors:   {default: {}}
params:   {}

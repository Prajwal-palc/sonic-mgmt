defaults:
  cli_type: klish
  verify_timeout: 30
  cleanup: true
  #min_topology:
  #  - "D1:1"

# NTP Server configuration
ntp_servers:
  primary_server:
    address: "10.10.10.1"
    version: 4
    prefer: true
    iburst: true
  secondary_server:
    address: "10.10.10.2"
    version: 4
    iburst: true
  hostname_server:
    address: "time.google.com"
    association: pool
    iburst: true
  test_servers:
    - "10.10.10.100"
    - "10.10.10.101"
    - "10.10.10.102"

# Authentication keys configuration
auth_keys:
  md5_key:
    key_id: 1
    auth_type: md5
    password: "TestPassword123"
  sha1_key:
    key_id: 2
    auth_type: sha1
    password: "SHA1Password456"
  sha256_key:
    key_id: 3
    auth_type: sha256
    password: "SHA256SecurePass"
  sha384_key:
    key_id: 4
    auth_type: sha384
    password: "SHA384SecurePass"
  sha512_key:
    key_id: 5
    auth_type: sha512
    password: "SHA512SecurePass"

# Trusted keys
trusted_keys:
  - 1
  - 2
  - 3

# Source interfaces
source_interfaces:
  - "Ethernet0"
  - "Management0"

# VRF configuration
vrf_names:
  - "mgmt"
  - "default"

# Test cases configuration
testcases:
  "NTP_001":
    title: "Enable NTP service"
    description: "Verify NTP service can be enabled"
    commands:
      - "ntp enable"
    verify:
      - contains: "enable"

  "NTP_002":
    title: "Disable NTP service"
    description: "Verify NTP service can be disabled"
    commands:
      - "ntp enable"
      - "no ntp enable"
    verify:
      - not_contains: "enable"

  "NTP_003":
    title: "Enable NTP authentication"
    description: "Verify NTP authentication can be enabled"
    commands:
      - "ntp authenticate"
    verify:
      - contains: "authenticate"

  "NTP_004":
    title: "Configure NTP authentication key with MD5"
    description: "Verify MD5 authentication key configuration"
    setup:
      - "ntp authentication-key 1 md5 TestPassword123"
    verify:
      - contains: "key"

  "NTP_005":
    title: "Configure NTP server with IP"
    description: "Verify NTP server configuration with IP address"
    setup:
      - "ntp server 10.10.10.1"
    verify:
      - contains: "10.10.10.1"

  "NTP_006":
    title: "Configure NTP server with all options"
    description: "Verify NTP server with version, key, prefer, and iburst"
    setup:
      - "ntp authentication-key 10 sha256 CompleteKey"
      - "ntp trusted-key 10"
      - "ntp server 10.10.10.50 version 4 key 10 prefer iburst"
    verify:
      - contains: "10.10.10.50"
      - contains: "prefer"

  "NTP_007":
    title: "Configure NTP source interface"
    description: "Verify NTP source interface configuration"
    setup:
      - "ntp source-interface Ethernet0"
    verify:
      - contains: "Ethernet0"

  "NTP_008":
    title: "Configure NTP VRF"
    description: "Verify NTP VRF configuration"
    setup:
      - "ntp vrf mgmt"
    verify:
      - contains: "mgmt"

  "NTP_009":
    title: "Configure multiple NTP servers"
    description: "Verify multiple NTP server configuration"
    setup:
      - "ntp server 10.10.10.100"
      - "ntp server 10.10.10.101"
      - "ntp server 10.10.10.102"
    verify:
      - contains: "10.10.10.100"
      - contains: "10.10.10.101"
      - contains: "10.10.10.102"

  "NTP_010":
    title: "Delete NTP server"
    description: "Verify NTP server can be deleted"
    setup:
      - "ntp server 10.10.10.200"
      - "no ntp server 10.10.10.200"
    verify:
      - not_contains: "10.10.10.200"

  "NTP_011":
    title: "Complete NTP setup with authentication"
    description: "Verify complete NTP configuration workflow"
    setup:
      - "ntp enable"
      - "ntp authenticate"
      - "ntp authentication-key 100 sha256 SecurePassword123"
      - "ntp trusted-key 100"
      - "ntp server 10.10.10.250 version 4 key 100 prefer iburst"
    verify:
      - contains: "enable"
      - contains: "authenticate"
      - contains: "10.10.10.250"

defaults:
  cli_type: klish
  min_topology:
    - D1D2:1
  cleanup: true
  verify_timeout: 60

testcases:
  static_route_via_dut2:
    id: TC-IP-STATIC-001
    interfaces:
      - alias: D1
        interface: Ethernet32
        ip: 20.1.1.3
        prefix: 24
        family: ipv4
      - alias: D2
        interface: Ethernet32
        ip: 20.1.1.4
        prefix: 24
        family: ipv4
      - alias: D2
        interface: Ethernet36
        ip: 30.1.1.3
        prefix: 24
        family: ipv4
    static_route:
      owner_alias: D1
      next_hop_alias: D2
      route: 30.1.1.0/24
      next_hop: 20.1.1.4
      family: ipv4
    ping:
      source_alias: D1
      target: 30.1.1.3
      source_interface: Ethernet32
      count: 5
      family: ipv4

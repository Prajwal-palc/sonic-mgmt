  # ============================================================================
  # Test ID 3.2.2.7: IPv6 Network Advertisement with Prefix-List Filtering
  # ============================================================================
  "3.2.2.7":
    title: "IPv6 Network Advertisement with Prefix-List Filtering"
    description: "Verify IPv6 routes advertised with prefix-list filtering applied"
    test_objective: "Verify prefix-list filtering for IPv6 route advertisement"
    interfaces:
      - dut: "D1"
        interface: "Ethernet4"
        ip_address: "2001:db8:24::1"
        prefix_length: 64
      - dut: "D2"
        interface: "Ethernet4"
        ip_address: "2001:db8:24::2"
        prefix_length: 64
    loopbacks:
      - dut: "D1"
        loopback: "Loopback1"
        ip_address: "2001:db8:100::1"
        prefix_length: 128
      - dut: "D1"
        loopback: "Loopback2"
        ip_address: "2001:db8:101::1"
        prefix_length: 128
      - dut: "D1"
        loopback: "Loopback3"
        ip_address: "2001:db8:102::1"
        prefix_length: 128
    static_routes: []
    bgp_routers:
      - dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
        vrf: "default"
      - dut: "D2"
        local_asn: 65002
        router_id: "2.2.2.2"
        vrf: "default"
    bgp_neighbors:
      - dut: "D1"
        local_asn: 65001
        neighbor_ip: "2001:db8:24::2"
        remote_asn: 65002
        vrf: "default"
        address_family: "ipv6"
        activate: true
        prefix_list_out: "ALLOW_100"  # Only allow 2001:db8:100::/64 routes
      - dut: "D2"
        local_asn: 65002
        neighbor_ip: "2001:db8:24::1"
        remote_asn: 65001
        vrf: "default"
        address_family: "ipv6"
        activate: true
    prefix_lists:
      - dut: "D1"
        name: "ALLOW_100"
        family: "ipv6"
        seq: 10
        action: "permit"
        prefix: "2001:db8:100::1/128"
      - dut: "D1"
        name: "ALLOW_100"
        family: "ipv6"
        seq: 20
        action: "deny"
        prefix: "::/0"
        le: 128
    bgp_networks:
      - dut: "D1"
        local_asn: 65001
        network: "2001:db8:100::1"
        prefix_length: 128
        address_family: "ipv6"
        vrf: "default"
      - dut: "D1"
        local_asn: 65001
        network: "2001:db8:101::1"
        prefix_length: 128
        address_family: "ipv6"
        vrf: "default"
      - dut: "D1"
        local_asn: 65001
        network: "2001:db8:102::1"
        prefix_length: 128
        address_family: "ipv6"
        vrf: "default"
    verification:
      - dut: "D2"
        command: "show bgp ipv6 unicast"
        expected_routes:
          - "2001:db8:100::1/128"  # Only this route should be advertised
        unexpected_routes:
          - "2001:db8:101::1/128"  # These should be filtered
          - "2001:db8:102::1/128"
        expected_next_hop: "2001:db8:24::1"
        expected_as_path: "65001"
        min_routes: 1
        max_routes: 1


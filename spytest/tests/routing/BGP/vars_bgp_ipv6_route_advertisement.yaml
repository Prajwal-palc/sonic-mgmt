        expected_next_hop: "2001:db8:24::2"
        expected_as_path: "65002"
        min_routes: 2
      - dut: "D2"
        command: "show bgp ipv6 unicast"
        expected_routes:
          - "2001:db8:100::/64"  # Routes learned from D1
          - "2001:db8:101::/64"
        expected_next_hop: "2001:db8:24::1"
        expected_as_path: "65001"
        min_routes: 2

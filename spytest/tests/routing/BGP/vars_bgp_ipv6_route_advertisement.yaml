  # ============================================================================
  # Test ID 3.2.2.5: IPv6 Network Advertisement with Next-Hop-Self (iBGP)
  # ============================================================================
  "3.2.2.5":
    title: "IPv6 Network Advertisement with Next-Hop-Self (iBGP)"
    description: "Verify IPv6 routes advertised with next-hop-self in iBGP scenario"
    test_objective: "Verify next-hop-self configuration for IPv6 iBGP peering"
    interfaces:
      - dut: "D1"
        interface: "Ethernet4"
        ip_address: "2001:db8:24::1"
        prefix_length: 64
      - dut: "D2"
        interface: "Ethernet4"
        ip_address: "2001:db8:24::2"
        prefix_length: 64
    loopbacks:
      - dut: "D1"
        loopback: "Loopback0"
        ip_address: "2001:db8:1::1"
        prefix_length: 128
      - dut: "D2"
        loopback: "Loopback0"
        ip_address: "2001:db8:2::2"
        prefix_length: 128
      - dut: "D1"
        loopback: "Loopback1"
        ip_address: "2001:db8:100::1"
        prefix_length: 128
    static_routes:
      - dut: "D1"
        destination: "2001:db8:2::2/128"
        next_hop: "2001:db8:24::2"
      - dut: "D2"
        destination: "2001:db8:1::1/128"
        next_hop: "2001:db8:24::1"
    bgp_routers:
      - dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
        vrf: "default"
      - dut: "D2"
        local_asn: 65001
        router_id: "2.2.2.2"
        vrf: "default"
    bgp_neighbors:
      - dut: "D1"
        local_asn: 65001
        neighbor_ip: "2001:db8:2::2"
        remote_asn: 65001
        update_source: "Loopback0"
        vrf: "default"
        address_family: "ipv6"
        activate: true
        next_hop_self: true
      - dut: "D2"
        local_asn: 65001
        neighbor_ip: "2001:db8:1::1"
        remote_asn: 65001
        update_source: "Loopback0"
        vrf: "default"
        address_family: "ipv6"
        activate: true
    bgp_networks:
      - dut: "D1"
        local_asn: 65001
        network: "2001:db8:100::1"
        prefix_length: 128
        address_family: "ipv6"
        vrf: "default"
    verification:
      - dut: "D2"
        command: "show bgp ipv6 unicast 2001:db8:100::1/128"
        expected_routes:
          - "2001:db8:100::1/128"
        expected_next_hop: "2001:db8:1::1"  # Next-hop modified to D1's loopback
        expected_as_path: ""


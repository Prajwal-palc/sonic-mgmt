# BGP IPv6 Unicast Route Advertisement Test Variables
# Test ID 3.2.2 - All Sub-testcases (3.2.2.1 through 3.2.2.8)
# Test Objective: Verify IPv6 unicast routes advertised correctly

defaults:
  cli_type: "klish"  # BGP configuration requires klish/vtysh, not click
  verify_timeout: 120  # Seconds to wait for BGP convergence and route advertisement
  cleanup: true  # Cleanup configuration after each test
  min_topology:
    - "D1D2:1"  # Minimum topology: 2 DUTs with 1 link
  keepalive: 60  # BGP keepalive timer (seconds)
  hold: 180  # BGP hold timer (seconds)

# ============================================================================
# Test ID 3.2.2.1: Basic IPv6 Network Advertisement via eBGP (Single Prefix)
# ============================================================================
testcases:
  "3.2.2.1":
    title: "Basic IPv6 Network Advertisement via eBGP (Single Prefix)"
    description: "Verify a single IPv6 network is advertised correctly from D1 to D2 via eBGP"
    test_objective: "Verify IPv6 unicast routes advertised correctly via eBGP"
    interfaces:
      - dut: "D1"
        interface: "Ethernet4"
        ip_address: "2001:db8:24::1"
        prefix_length: 64
      - dut: "D2"
        interface: "Ethernet4"
        ip_address: "2001:db8:24::2"
        prefix_length: 64
    loopbacks:
      - dut: "D1"
        loopback: "Loopback1"
        ip_address: "2001:db8:100::1"
        prefix_length: 128
    static_routes: []
    bgp_routers:
      - dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
        vrf: "default"
      - dut: "D2"
        local_asn: 65002
        router_id: "2.2.2.2"
        vrf: "default"
    bgp_neighbors:
      - dut: "D1"
        local_asn: 65001
        neighbor_ip: "2001:db8:24::2"
        remote_asn: 65002
        vrf: "default"
        address_family: "ipv6"
        activate: true
      - dut: "D2"
        local_asn: 65002
        neighbor_ip: "2001:db8:24::1"
        remote_asn: 65001
        vrf: "default"
        address_family: "ipv6"
        activate: true
    bgp_networks:
      - dut: "D1"
        local_asn: 65001
        network: "2001:db8:100::1"
        prefix_length: 128
        address_family: "ipv6"
        vrf: "default"
    verification:
      - dut: "D2"
        command: "show bgp ipv6 unicast"
        expected_routes:
          - "2001:db8:100::1/128"
        expected_next_hop: "2001:db8:24::1"
        expected_as_path: "65001"


# BGP IPv4 over Loopback Test Variables - eBGP
# This file contains test configuration for eBGP session establishment over Loopback interfaces

defaults:
  cli_type: klish
  verify_timeout: 120
  cleanup: true
  min_topology:
    - "D1D2:1"

# Testcase definitions
testcases:
  # Test BGP-LB-eBGP-001: eBGP over Loopback Session Establishment
  BGP-LB-eBGP-001:
    title: "eBGP over Loopback Configuration and Session Establishment"
    description: "Verify eBGP IPv4 neighbor session establishment over Loopback interface with eBGP multihop"

    # Loopback interface creation
    loopbacks:
      - dut: "D1"
        interface: "Loopback0"
      - dut: "D2"
        interface: "Loopback0"

    # Loopback interface IP configuration
    loopback_interfaces:
      - dut: "D1"
        interface: "Loopback0"
        ip_address: "1.1.1.1"
        prefix_length: 32
      - dut: "D2"
        interface: "Loopback0"
        ip_address: "2.2.2.2"
        prefix_length: 32

    # Underlay interface configuration (physical connectivity)
    underlay_interfaces:
      - dut: "D1"
        interface: "{{D1D2P1}}"
        ip_address: "10.0.0.1"
        prefix_length: 24
        admin_status: "up"
      - dut: "D2"
        interface: "{{D1D2P1}}"
        ip_address: "10.0.0.2"
        prefix_length: 24
        admin_status: "up"

    # Static routes for loopback reachability
    static_routes:
      - dut: "D1"
        destination: "2.2.2.2/32"
        next_hop: "10.0.0.2"
      - dut: "D2"
        destination: "1.1.1.1/32"
        next_hop: "10.0.0.1"

    # BGP router configuration
    bgp_routers:
      - dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
      - dut: "D2"
        local_asn: 65002
        router_id: "2.2.2.2"

    # BGP neighbor configuration (eBGP over Loopback)
    bgp_neighbors:
      - dut: "D1"
        local_asn: 65001
        neighbor_ip: "2.2.2.2"
        remote_asn: 65002
        update_source: "Loopback0"
        ebgp_multihop: 2
        family: "ipv4"
        activate: true
      - dut: "D2"
        local_asn: 65002
        neighbor_ip: "1.1.1.1"
        remote_asn: 65001
        update_source: "Loopback0"
        ebgp_multihop: 2
        family: "ipv4"
        activate: true

    # Verification checks
    verification:
      bgp_session_checks:
        - dut: "D1"
          neighbor_ip: "2.2.2.2"
          expected_state: "Established"
          remote_asn: 65002
        - dut: "D2"
          neighbor_ip: "1.1.1.1"
          expected_state: "Established"
          remote_asn: 65001

  # Test BGP-LB-eBGP-002: Interface Flap Scenario
  BGP-LB-eBGP-002:
    title: "eBGP over Loopback Interface Flap Scenario"
    description: "Validate eBGP session resilience to underlay interface flap"

    underlay_interface: "Ethernet4"

    # Verification checks (reuse session checks from BGP-LB-eBGP-001)
    verification:
      bgp_session_checks:
        - dut: "D1"
          neighbor_ip: "2.2.2.2"
          expected_state: "Established"
          remote_asn: 65002
        - dut: "D2"
          neighbor_ip: "1.1.1.1"
          expected_state: "Established"
          remote_asn: 65001

  # Test BGP-LB-eBGP-003: Traffic Validation with Scapy
  BGP-LB-eBGP-003:
    title: "eBGP over Loopback Traffic Validation using Scapy"
    description: "Validate bidirectional traffic forwarding using Scapy-generated packets"

    local_asn_dut1: 65001
    local_asn_dut2: 65002
    test_network_dut1: "192.168.10.0/24"
    test_network_dut2: "192.168.20.0/24"

    # Verification checks (reuse session checks from BGP-LB-eBGP-001)
    verification:
      bgp_session_checks:
        - dut: "D1"
          neighbor_ip: "2.2.2.2"
          expected_state: "Established"
          remote_asn: 65002
        - dut: "D2"
          neighbor_ip: "1.1.1.1"
          expected_state: "Established"
          remote_asn: 65001

  # Test BGP-LB-eBGP-004: Save and Reboot
  BGP-LB-eBGP-004:
    title: "eBGP over Loopback Config Persistence (Save and Reboot)"
    description: "Verify eBGP configuration over Loopback persists across save and reboot"

    # Verification checks after reboot
    verification:
      # Interface checks
      interface_checks:
        - dut: "D1"
          interface: "Loopback0"
          expected_status: "up"
        - dut: "D2"
          interface: "Loopback0"
          expected_status: "up"
        - dut: "D1"
          interface: "Ethernet4"
          expected_status: "up"
        - dut: "D2"
          interface: "Ethernet4"
          expected_status: "up"

      # BGP session checks
      bgp_session_checks:
        - dut: "D1"
          neighbor_ip: "2.2.2.2"
          expected_state: "Established"
          remote_asn: 65002
        - dut: "D2"
          neighbor_ip: "1.1.1.1"
          expected_state: "Established"
          remote_asn: 65001

# Cleanup configuration (executed in teardown_class)
cleanup:
  # BGP neighbors to remove
  bgp_neighbors:
    - dut: "D1"
      local_asn: 65001
      neighbor_ip: "2.2.2.2"
    - dut: "D2"
      local_asn: 65002
      neighbor_ip: "1.1.1.1"

  # BGP routers to remove
  bgp_routers:
    - dut: "D1"
      local_asn: 65001
    - dut: "D2"
      local_asn: 65002

  # Loopback interface IPs to remove
  loopback_interfaces:
    - dut: "D1"
      interface: "Loopback0"
    - dut: "D2"
      interface: "Loopback0"

  # Loopback interfaces to remove
  loopbacks:
    - dut: "D1"
      interface: "Loopback0"
    - dut: "D2"
      interface: "Loopback0"

  # Underlay interface IPs to remove
  underlay_interfaces:
    - dut: "D1"
      interface: "Ethernet4"
    - dut: "D2"
      interface: "Ethernet4"

  # Static routes to remove
  static_routes:
    - dut: "D1"
      destination: "2.2.2.2/32"
      next_hop: "10.1.1.2"
    - dut: "D2"
      destination: "1.1.1.1/32"
      next_hop: "10.1.1.1"

# BGP IPv4 Route Advertisement Test Variables - Test ID 3.2.1
# Variables for testcases validating IPv4 unicast route advertisement to BGP neighbors
# Reference topology: testbeds/testbed_vs_2node.yaml

defaults:
  cli_type: klish
  verify_timeout: 120
  cleanup: true
  min_topology:
    - "D1D2:1"
  keepalive: 60
  hold: 180

# ============================================================================
# Test ID 3.2.1.1: Basic IPv4 Network Advertisement via network command
# ============================================================================
testcases:
  "3.2.1.1":
    title: "Basic IPv4 Network Advertisement via network command"
    description: "Verify basic IPv4 network advertisement from R1 to R2 using network command"
    cli_type: "klish"
    setup:
      - type: "interface"
        dut: "D1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1"
        prefix_length: 30
        family: "ipv4"
      - type: "interface"
        dut: "D2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2"
        prefix_length: 30
        family: "ipv4"
      - type: "loopback"
        dut: "D1"
        loopback: "Loopback1"
        ip_address: "192.168.1.1"
        prefix_length: 24
        family: "ipv4"
      - type: "bgp_router"
        dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
      - type: "bgp_router"
        dut: "D2"
        local_asn: 65002
        router_id: "2.2.2.2"
      - type: "bgp_neighbor"
        dut: "D1"
        local_asn: 65001
        neighbor_ip: "10.0.0.2"
        remote_asn: 65002
        family: "ipv4"
      - type: "bgp_neighbor"
        dut: "D2"
        local_asn: 65002
        neighbor_ip: "10.0.0.1"
        remote_asn: 65001
        family: "ipv4"
      - type: "bgp_network"
        dut: "D1"
        local_asn: 65001
        prefix: "192.168.1.0/24"
        family: "ipv4"
    verify:
      - dut: "D1"
        neighbor_ip: "10.0.0.2"
        family: "ipv4"
        state: "Established"
      - dut: "D2"
        neighbor_ip: "10.0.0.1"
        family: "ipv4"
        state: "Established"
      - dut: "D2"
        check_route: "192.168.1.0/24"
        next_hop: "10.0.0.1"
        family: "ipv4"
        expected: "present"


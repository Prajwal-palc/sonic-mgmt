# BGP Session Recovery After Interface Flap - Test ID 2.4.5
# Variable definitions for test_bgp_session_recovery_after_interface_flap.py
#
# This YAML file defines configuration parameters for BGP session recovery tests
# after interface flap events. Each test case validates different BGP scenarios
# (eBGP/iBGP, numbered/unnumbered, multihop, BFD-enabled).

defaults:
  cli_type: klish  # BGP configuration requires klish mode in SONiC
  verify_timeout: 90  # Timeout for BGP verification operations
  establish_timeout: 90  # Timeout for initial BGP session establishment
  downtime_slo: 10  # Maximum acceptable downtime (SLO) in seconds
  flap_hold_time: 3  # Duration to hold interface in shutdown state
  keepalive: 60  # BGP keepalive timer (seconds)
  hold: 180  # BGP hold timer (seconds)
  cleanup: true  # Perform cleanup after each test
  min_topology:
    - "D1D2:1"  # Minimum topology requirement: 2 DUTs with 1 link

testcases:
  "2.4.5.1":
    title: "eBGP IPv4 numbered (/30) – flap on DUT1"
    description: "Verify eBGP session re-establishes within SLO after interface flap on DUT1"
    interfaces:
      - dut: "D1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1"
        prefix_length: 30
        cli_type: "klish"
      - dut: "D2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2"
        prefix_length: 30
        cli_type: "klish"
    routers:
      - dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
        cli_type: "klish"
      - dut: "D2"
        local_asn: 65002
        router_id: "2.2.2.2"
        cli_type: "klish"
    neighbors:
      - dut: "D1"
        local_asn: 65001
        neighbor: "10.0.0.2"
        remote_asn: 65002
        activate_family: "ipv4"
        cli_type: "klish"
      - dut: "D2"
        local_asn: 65002
        neighbor: "10.0.0.1"
        remote_asn: 65001
        activate_family: "ipv4"
        cli_type: "klish"
    flap:
      dut: "D1"
      interface: "Ethernet4"

  "2.4.5.2":
    title: "eBGP IPv4 numbered (/30) – flap on DUT2"
    description: "Verify eBGP session re-establishes within SLO after interface flap on DUT2"
    interfaces:
      - dut: "D1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1"
        prefix_length: 30
        cli_type: "klish"
      - dut: "D2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2"
        prefix_length: 30
        cli_type: "klish"
    routers:
      - dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
        cli_type: "klish"
      - dut: "D2"
        local_asn: 65002
        router_id: "2.2.2.2"
        cli_type: "klish"
    neighbors:
      - dut: "D1"
        local_asn: 65001
        neighbor: "10.0.0.2"
        remote_asn: 65002
        activate_family: "ipv4"
        cli_type: "klish"
      - dut: "D2"
        local_asn: 65002
        neighbor: "10.0.0.1"
        remote_asn: 65001
        activate_family: "ipv4"
        cli_type: "klish"
    flap:
      dut: "D2"
      interface: "Ethernet4"

  "2.4.5.3":
    title: "iBGP IPv4 numbered (/30) – flap on DUT1"
    description: "Verify iBGP session re-establishes within SLO after interface flap on DUT1"
    interfaces:
      - dut: "D1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1"
        prefix_length: 30
        cli_type: "klish"
      - dut: "D2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2"
        prefix_length: 30
        cli_type: "klish"
    routers:
      - dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
        cli_type: "klish"
      - dut: "D2"
        local_asn: 65001
        router_id: "2.2.2.2"
        cli_type: "klish"
    neighbors:
      - dut: "D1"
        local_asn: 65001
        neighbor: "10.0.0.2"
        remote_asn: 65001  # Same AS for iBGP
        activate_family: "ipv4"
        cli_type: "klish"
      - dut: "D2"
        local_asn: 65001
        neighbor: "10.0.0.1"
        remote_asn: 65001  # Same AS for iBGP
        activate_family: "ipv4"
        cli_type: "klish"
    flap:
      dut: "D1"
      interface: "Ethernet4"

  "2.4.5.4":
    title: "iBGP IPv4 unnumbered – flap on DUT1"
    description: "Verify unnumbered iBGP session re-establishes within SLO after interface flap"
    routers:
      - dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
        cli_type: "klish"
      - dut: "D2"
        local_asn: 65001
        router_id: "2.2.2.2"
        cli_type: "klish"
    neighbors:
      - dut: "D1"
        local_asn: 65001
        neighbor: null  # Unnumbered - no IP neighbor
        interface: "Ethernet4"  # Interface-based neighbor
        remote_asn: 65001  # Same AS for iBGP
        activate_family: "ipv4"
        extended_nexthop: true  # Required for unnumbered IPv4
        cli_type: "klish"
      - dut: "D2"
        local_asn: 65001
        neighbor: null  # Unnumbered - no IP neighbor
        interface: "Ethernet4"  # Interface-based neighbor
        remote_asn: 65001  # Same AS for iBGP
        activate_family: "ipv4"
        extended_nexthop: true  # Required for unnumbered IPv4
        cli_type: "klish"
    flap:
      dut: "D1"
      interface: "Ethernet4"

  "2.4.5.5":
    title: "eBGP multihop over loopbacks – flap underlay on DUT1"
    description: "Verify multihop eBGP session recovers when physical underlay link flaps"
    loopbacks:
      - dut: "D1"
        loopback: "Loopback0"
        ip_address: "1.1.1.1"
        prefix_length: 32
        cli_type: "klish"
      - dut: "D2"
        loopback: "Loopback0"
        ip_address: "2.2.2.2"
        prefix_length: 32
        cli_type: "klish"
    interfaces:
      - dut: "D1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1"
        prefix_length: 30
        cli_type: "klish"
      - dut: "D2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2"
        prefix_length: 30
        cli_type: "klish"
    static_routes:
      - dut: "D1"
        destination: "2.2.2.2/32"
        nexthop: "10.0.0.2"
        cli_type: "klish"
      - dut: "D2"
        destination: "1.1.1.1/32"
        nexthop: "10.0.0.1"
        cli_type: "klish"
    routers:
      - dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
        cli_type: "klish"
      - dut: "D2"
        local_asn: 65002
        router_id: "2.2.2.2"
        cli_type: "klish"
    neighbors:
      - dut: "D1"
        local_asn: 65001
        neighbor: "2.2.2.2"  # Loopback IP of DUT2
        remote_asn: 65002
        update_source: "Loopback0"  # Use loopback as source
        ebgp_multihop: 2  # Enable multihop
        activate_family: "ipv4"
        cli_type: "klish"
      - dut: "D2"
        local_asn: 65002
        neighbor: "1.1.1.1"  # Loopback IP of DUT1
        remote_asn: 65001
        update_source: "Loopback0"  # Use loopback as source
        ebgp_multihop: 2  # Enable multihop
        activate_family: "ipv4"
        cli_type: "klish"
    flap:
      dut: "D1"
      interface: "Ethernet4"  # Flap the underlay interface

  "2.4.5.6":
    title: "eBGP numbered with BFD – faster recovery after flap (optional)"
    description: "Demonstrate that BFD significantly shortens downtime compared to standard BGP"
    interfaces:
      - dut: "D1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1"
        prefix_length: 30
        cli_type: "klish"
      - dut: "D2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2"
        prefix_length: 30
        cli_type: "klish"
    routers:
      - dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
        cli_type: "klish"
      - dut: "D2"
        local_asn: 65002
        router_id: "2.2.2.2"
        cli_type: "klish"
    neighbors:
      - dut: "D1"
        local_asn: 65001
        neighbor: "10.0.0.2"
        remote_asn: 65002
        activate_family: "ipv4"
        cli_type: "klish"
      - dut: "D2"
        local_asn: 65002
        neighbor: "10.0.0.1"
        remote_asn: 65001
        activate_family: "ipv4"
        cli_type: "klish"
    bfd:
      - dut: "D1"
        local_asn: 65001
        neighbor: "10.0.0.2"
        cli_type: "klish"
      - dut: "D2"
        local_asn: 65002
        neighbor: "10.0.0.1"
        cli_type: "klish"
    flap:
      dut: "D1"
      interface: "Ethernet4"

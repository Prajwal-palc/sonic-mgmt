# BGP Test ID 3.1.5: ECMP Path Installation
# Variables for test_bgp_ecmp_path_installation.py

defaults:
  cli_type: klish  # Configuration uses klish
  show_cli_type: click  # Show commands use click for JSON output
  verify_timeout: 60
  cleanup: true
  min_topology:
    - "D1D2:1"

# Topology-specific settings
# Based on testbed_vs_2node.yaml:
# - smic_sonic1 (D1) <-> smic_sonic2 (D2) via Ethernet4
topology:
  D1:
    name: "smic_sonic1"
    as_number: 65001
    router_id: "1.1.1.1"
    interfaces:
      - name: "Ethernet4"
        ipv4: "10.0.24.1/31"
        ipv6: "2001:db8:24::1/64"
      - name: "Loopback0"
        ipv4: "1.1.1.1/32"
        ipv6: "2001:db8:1::1/128"

  D2:
    name: "smic_sonic2"
    as_number: 65002
    router_id: "2.2.2.2"
    interfaces:
      - name: "Ethernet4"
        ipv4: "10.0.24.0/31"
        ipv6: "2001:db8:24::2/64"
      - name: "Loopback0"
        ipv4: "2.2.2.2/32"
        ipv6: "2001:db8:2::2/128"
      - name: "Loopback10"
        ipv4: "10.2.10.1/32"
        ipv6: "2001:db8:10::1/128"
      - name: "Loopback11"
        ipv4: "10.2.11.1/32"
        ipv6: "2001:db8:11::1/128"
      - name: "Loopback20"
        ipv4: "10.2.20.1/32"
        ipv6: "2001:db8:20::1/128"

# Test prefixes for advertisement
test_prefixes:
  ipv4:
    - "198.51.120.0/24"  # TC 3.1.5.1, 3.1.5.2
    - "198.51.130.0/24"  # TC 3.1.5.3
    - "198.51.150.0/24"  # TC 3.1.5.5
    - "198.51.160.0/24"  # TC 3.1.5.10
  ipv6:
    - "2001:db8:120::/64"  # TC 3.1.5.4

# Test cases configuration
testcases:
  "3.1.5.1":
    title: "Basic IPv4 ECMP - two equal-cost eBGP peers (control-plane & RIB verification)"
    description: "Enable BGP multipath and verify two equal-cost IPv4 paths present in BGP RIB"
    timeout: 90
    convergence_wait: 30

    # Interface configuration
    interfaces:
      - dut: "D1"
        name: "Ethernet4"
        ipv4: "10.0.24.1/31"
      - dut: "D1"
        name: "Loopback0"
        ipv4: "1.1.1.1/32"
      - dut: "D2"
        name: "Ethernet4"
        ipv4: "10.0.24.0/31"
      - dut: "D2"
        name: "Loopback0"
        ipv4: "2.2.2.2/32"
      - dut: "D2"
        name: "Loopback10"
        ipv4: "10.2.10.1/32"
      - dut: "D2"
        name: "Loopback11"
        ipv4: "10.2.11.1/32"

    # BGP router configuration
    bgp_routers:
      - dut: "D1"
        local_as: 65001
        router_id: "1.1.1.1"
      - dut: "D2"
        local_as: 65002
        router_id: "2.2.2.2"

    # BGP neighbor configuration
    bgp_neighbors:
      - dut: "D1"
        local_as: 65001
        neighbor_ip: "10.0.24.0"
        remote_as: 65002
        addr_family: "ipv4"
      - dut: "D2"
        local_as: 65002
        neighbor_ip: "10.0.24.1"
        remote_as: 65001
        addr_family: "ipv4"

    # Wait for BGP sessions to establish
    wait_bgp_sessions:
      - dut: "D1"
        neighbor_ip: "10.0.24.0"
      - dut: "D2"
        neighbor_ip: "10.0.24.1"

    # Configure max-paths for ECMP
    max_paths:
      - dut: "D1"
        value: 4
        addr_family: "ipv4"

    # Advertise test networks
    # Simulating two equal-cost paths by advertising from loopbacks with static routes
    networks:
      - dut: "D2"
        local_as: 65002
        network: "198.51.120.0/24"
        addr_family: "ipv4"

    # Verification
    verify:
      dut: "D1"
      prefix: "198.51.120.0/24"
      expected_paths: 2
      addr_family: "ipv4"

  "3.1.5.2":
    title: "IPv4 ECMP - FIB programming & data-plane verification"
    description: "Verify equal-cost paths installed into FIB and traffic forwarded via multiple next-hops"
    timeout: 180
    convergence_wait: 30

    # Scapy traffic configuration
    traffic:
      src_ip: "10.0.24.1"
      num_flows: 100
      packets_per_flow: 10

    interfaces:
      - dut: "D1"
        name: "Ethernet4"
        ipv4: "10.0.24.1/31"
      - dut: "D1"
        name: "Loopback0"
        ipv4: "1.1.1.1/32"
      - dut: "D2"
        name: "Ethernet4"
        ipv4: "10.0.24.0/31"
      - dut: "D2"
        name: "Loopback0"
        ipv4: "2.2.2.2/32"
      - dut: "D2"
        name: "Loopback10"
        ipv4: "10.2.10.1/32"
      - dut: "D2"
        name: "Loopback11"
        ipv4: "10.2.11.1/32"

    bgp_routers:
      - dut: "D1"
        local_as: 65001
        router_id: "1.1.1.1"
      - dut: "D2"
        local_as: 65002
        router_id: "2.2.2.2"

    bgp_neighbors:
      - dut: "D1"
        local_as: 65001
        neighbor_ip: "10.0.24.0"
        remote_as: 65002
        addr_family: "ipv4"
      - dut: "D2"
        local_as: 65002
        neighbor_ip: "10.0.24.1"
        remote_as: 65001
        addr_family: "ipv4"

    wait_bgp_sessions:
      - dut: "D1"
        neighbor_ip: "10.0.24.0"
      - dut: "D2"
        neighbor_ip: "10.0.24.1"

    max_paths:
      - dut: "D1"
        value: 4
        addr_family: "ipv4"

    networks:
      - dut: "D2"
        local_as: 65002
        network: "198.51.120.0/24"
        addr_family: "ipv4"

    verify:
      dut: "D1"
      prefix: "198.51.120.0/24"
      expected_paths: 2
      addr_family: "ipv4"
      # Data-plane ping tests
      ping_tests:
        - from_dut: "D1"
          destination: "10.2.10.1"
          addr_family: "ipv4"
        - from_dut: "D1"
          destination: "10.2.11.1"
          addr_family: "ipv4"


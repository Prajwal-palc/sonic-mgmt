# BGP IPv4 Neighbor Session Establishment Test Variables
# Test ID 2.4.1 - All Sub-testcases (2.4.1.1 through 2.4.1.8)
# Reference: Doc/bgp_241.md

defaults:
  cli_type: "klish"  # BGP configuration requires klish/vtysh, not click
  verify_timeout: 120  # Seconds to wait for BGP session establishment
  cleanup: true  # Cleanup configuration after each test
  min_topology:
    - "D1D2:1"  # Minimum topology: 2 DUTs with 1 link
  keepalive: 60  # BGP keepalive timer (seconds)
  hold: 180  # BGP hold timer (seconds)

# ============================================================================
# Test ID 2.4.1.1: iBGP IPv4 Numbered (Loopback-Based)
# ============================================================================
testcases:
  "2.4.1.1":
    title: "iBGP IPv4 Numbered (Loopback-Based)"
    description: "Verify iBGP IPv4 neighbor session using numbered loopback addresses"
    interfaces:
      - dut: "D1"
        interface: "Ethernet4"
        ip_address: "10.0.24.1"
        prefix_length: 30
      - dut: "D2"
        interface: "Ethernet4"
        ip_address: "10.0.24.2"
        prefix_length: 30
    loopbacks:
      - dut: "D1"
        loopback: "Loopback0"
        ip_address: "1.1.1.1"
        prefix_length: 32
      - dut: "D2"
        loopback: "Loopback0"
        ip_address: "2.2.2.2"
        prefix_length: 32
    static_routes:
      - dut: "D1"
        destination: "2.2.2.2/32"
        next_hop: "10.0.24.2"
      - dut: "D2"
        destination: "1.1.1.1/32"
        next_hop: "10.0.24.1"
    bgp_routers:
      - dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
        vrf: "default"
      - dut: "D2"
        local_asn: 65001
        router_id: "2.2.2.2"
        vrf: "default"
    bgp_neighbors:
      - dut: "D1"
        local_asn: 65001
        neighbor_ip: "2.2.2.2"
        remote_asn: 65001
        update_source: "Loopback0"
        vrf: "default"
      - dut: "D2"
        local_asn: 65001
        neighbor_ip: "1.1.1.1"
        remote_asn: 65001
        update_source: "Loopback0"
        vrf: "default"

  # ============================================================================
  # Test ID 2.4.1.2: iBGP IPv4 Unnumbered (Loopback-Based)
  # ============================================================================
  "2.4.1.2":
    title: "iBGP IPv4 Unnumbered (Loopback-Based)"
    description: "Verify iBGP IPv4 neighbor session using unnumbered interfaces with loopback"
    loopbacks:
      - dut: "D1"
        loopback: "Loopback0"
        ip_address: "1.1.1.1"
        prefix_length: 32
      - dut: "D2"
        loopback: "Loopback0"
        ip_address: "2.2.2.2"
        prefix_length: 32
    interfaces:
      - dut: "D1"
        interface: "Ethernet4"
        ip_address: "unnumbered"
        prefix_length: 0
        unnumbered_ref: "Loopback0"
      - dut: "D2"
        interface: "Ethernet4"
        ip_address: "unnumbered"
        prefix_length: 0
        unnumbered_ref: "Loopback0"
    bgp_routers:
      - dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
        vrf: "default"
      - dut: "D2"
        local_asn: 65001
        router_id: "2.2.2.2"
        vrf: "default"
    bgp_neighbors:
      - dut: "D1"
        local_asn: 65001
        interface: "Ethernet4"
        remote_asn: 65001
        vrf: "default"
      - dut: "D2"

  "4.1.4.10":
    title: "Diagnostics & logging: capture BGP UPDATE/REFRESH and system logs"
    description: "Capture packet-level and system logs during route-refresh events to aid debugging."
    setup:
      d1_bgp:
        dut: "D1"
        local_asn: 65001
        vrf: "default"
        router_id: "1.1.1.1"
      d2_bgp:

# BGP Test ID 4.1.4: Route-refresh During Policy Change
# Variable definitions for test_bgp_route_refresh_policy_change.py

defaults:
  cli_type_config: "klish"  # Use klish for configuration
  cli_type_show: "click"    # Use click for show commands
  verify_timeout: 120       # Timeout in seconds for verification
  cleanup: true             # Enable cleanup after tests
  min_topology:
    - "D1D2:1"              # Minimum 2 DUTs with 1 link

  global_config:
    d1_interface: "Ethernet4"
    d2_interface: "Ethernet4"
    d1_ipv4: "10.1.1.1/24"
    d2_ipv4: "10.1.1.2/24"
    d1_ipv6: "2001:db8:1::1/64"
    d2_ipv6: "2001:db8:1::2/64"
    d1_asn: 65001
    d2_asn: 65002
    d1_router_id: "1.1.1.1"
    d2_router_id: "2.2.2.2"

testcases:
  "4.1.4.1":
    title: "Basic route-refresh (inbound policy change) - IPv4"
    description: "Modify inbound route-map on DUT and trigger route-refresh; verify routes re-evaluated and session stays Established."
    setup:
      d1_bgp:
        dut: "D1"
        local_asn: 65001
        vrf: "default"
        router_id: "1.1.1.1"
      d2_bgp:
        dut: "D2"
        local_asn: 65002
        vrf: "default"
        router_id: "2.2.2.2"
      d1_neighbor:
        dut: "D1"
        local_asn: 65001
        neighbor_ip: "10.1.1.2"
        remote_asn: 65002
        family: "ipv4"
        vrf: "default"
      d2_neighbor:
        dut: "D2"
        local_asn: 65002
        neighbor_ip: "10.1.1.1"
        remote_asn: 65001
        family: "ipv4"
        vrf: "default"
      test_network:
        dut: "D2"
        local_asn: 65002
        network: "192.168.100.0/24"
        family: "ipv4"
    policy:
      prefix_list:
        dut: "D1"
        name: "DENY_TEST"
        prefix: "192.168.100.0/24"
        family: "ipv4"
        action: "permit"
        seq: "10"
      route_map:
        dut: "D1"
        name: "RM-IN"
        seq: "10"
        action: "deny"
        family: "ipv4"
        match:
          prefix_list: "DENY_TEST"
    verify:
      prefix_withdrawn: true
      session_stable: true

  "4.1.4.2":
    title: "Basic route-refresh (outbound policy change) - IPv4"
    description: "Change outbound policy on DUT and trigger refresh so peer receives updated attributes without session teardown."
    setup:
      d1_bgp:
        dut: "D1"
        local_asn: 65001
        vrf: "default"
        router_id: "1.1.1.1"
      d2_bgp:
        dut: "D2"
        local_asn: 65002
        vrf: "default"
        router_id: "2.2.2.2"
      d1_neighbor:
        dut: "D1"
        local_asn: 65001
        neighbor_ip: "10.1.1.2"
        remote_asn: 65002
        family: "ipv4"
        vrf: "default"
      d2_neighbor:
        dut: "D2"
        local_asn: 65002
        neighbor_ip: "10.1.1.1"
        remote_asn: 65001
        family: "ipv4"
        vrf: "default"
      test_network:
        dut: "D1"
        local_asn: 65001
        network: "172.16.0.0/24"
        family: "ipv4"
    policy:
      route_map:
        dut: "D1"
        name: "RM-OUT"
        seq: "10"
        action: "permit"
        family: "ipv4"
        set:
          metric: 100
    verify:
      session_stable: true

  "4.1.4.3":
    title: "Soft-reconfiguration (if route-refresh unsupported) - inbound policy"
    description: "Validate using soft-reconfiguration to reapply policies when neighbor cannot send route-refresh."
    setup:
      d1_bgp:
        dut: "D1"
        local_asn: 65001
        vrf: "default"
        router_id: "1.1.1.1"
      d2_bgp:
        dut: "D2"
        local_asn: 65002
        vrf: "default"
        router_id: "2.2.2.2"
      d1_neighbor:
        dut: "D1"
        local_asn: 65001
        neighbor_ip: "10.1.1.2"
        remote_asn: 65002
        family: "ipv4"
        vrf: "default"
        soft_reconfig: "inbound"
      d2_neighbor:
        dut: "D2"
        local_asn: 65002
        neighbor_ip: "10.1.1.1"
        remote_asn: 65001
        family: "ipv4"
        vrf: "default"
      test_network:
        dut: "D2"
        local_asn: 65002
        network: "192.168.100.0/24"
        family: "ipv4"
    policy:
      prefix_list:
        dut: "D1"
        name: "FILTER_TEST"
        prefix: "192.168.100.0/24"
        family: "ipv4"
        action: "permit"
        seq: "10"
      route_map:
        dut: "D1"
        name: "RM-SOFT-IN"
        seq: "10"
        action: "deny"
        family: "ipv4"
        match:
          prefix_list: "FILTER_TEST"
    verify:
      prefix_withdrawn: true
      session_stable: true

  "4.1.4.4":
    title: "Route-refresh when neighbor lacks capability (behavior check)"
    description: "Confirm DUT behavior when peer does not advertise route-refresh capability."
    setup:
      d1_bgp:
        dut: "D1"
        local_asn: 65001
        vrf: "default"
        router_id: "1.1.1.1"
      d2_bgp:
        dut: "D2"
        local_asn: 65002
        vrf: "default"
        router_id: "2.2.2.2"
      d1_neighbor:
        dut: "D1"
        local_asn: 65001
        neighbor_ip: "10.1.1.2"
        remote_asn: 65002
        family: "ipv4"
        vrf: "default"
      d2_neighbor:
        dut: "D2"
        local_asn: 65002
        neighbor_ip: "10.1.1.1"
        remote_asn: 65001
        family: "ipv4"
        vrf: "default"
      test_network:
        dut: "D2"
        local_asn: 65002
        network: "192.168.100.0/24"
        family: "ipv4"
    policy:
      prefix_list:
        dut: "D1"
        name: "TEST_DENY"
        prefix: "192.168.100.0/24"
        family: "ipv4"
        action: "permit"
        seq: "10"
      route_map:
        dut: "D1"
        name: "RM-TEST"
        seq: "10"
        action: "deny"
        family: "ipv4"
        match:
          prefix_list: "TEST_DENY"
    verify:
      behavior_documented: true

  "4.1.4.5":
    title: "IPv6 route-refresh and policy change"
    description: "Apply inbound/outbound policy changes for IPv6 NLRI and trigger route-refresh."
    setup:
      d1_bgp:
        dut: "D1"
        local_asn: 65001
        vrf: "default"
        router_id: "1.1.1.1"
      d2_bgp:
        dut: "D2"
        local_asn: 65002
        vrf: "default"
        router_id: "2.2.2.2"
      d1_neighbor:
        dut: "D1"
        local_asn: 65001
        neighbor_ip: "2001:db8:1::2"
        remote_asn: 65002
        family: "ipv6"
        vrf: "default"
      d2_neighbor:
        dut: "D2"
        local_asn: 65002
        neighbor_ip: "2001:db8:1::1"
        remote_asn: 65001
        family: "ipv6"
        vrf: "default"
      test_network:
        dut: "D2"
        local_asn: 65002
        network: "2001:db8:100::/48"
        family: "ipv6"
    policy:
      prefix_list:
        dut: "D1"
        name: "DENY_TEST_V6"
        prefix: "2001:db8:100::/48"
        family: "ipv6"
        action: "permit"
        seq: "10"
      route_map:
        dut: "D1"
        name: "RM-IN-V6"
        seq: "10"
        action: "deny"
        family: "ipv6"
        match:
          prefix_list: "DENY_TEST_V6"
    verify:
      ipv6_rib_updated: true
      session_stable: true

  "4.1.4.6":
    title: "Large-scale route-refresh (thousands of routes) - control-plane and timing"
    description: "Measure time and control-plane impact when triggering route-refresh for a large route-set."
    setup:
      d1_bgp:
        dut: "D1"
        local_asn: 65001
        vrf: "default"
        router_id: "1.1.1.1"
      d2_bgp:
        dut: "D2"
        local_asn: 65002
        vrf: "default"
        router_id: "2.2.2.2"
      d1_neighbor:
        dut: "D1"
        local_asn: 65001
        neighbor_ip: "10.1.1.2"
        remote_asn: 65002
        family: "ipv4"
        vrf: "default"
      d2_neighbor:
        dut: "D2"
        local_asn: 65002
        neighbor_ip: "10.1.1.1"
        remote_asn: 65001
        family: "ipv4"
        vrf: "default"
      # Large-scale network injection configuration
      large_scale:
        enabled: true
        prefix_count: 5000
        base_network: "192.168.0.0/16"
    policy:
      prefix_list:
        dut: "D1"
        name: "DENY_SUBSET"
        prefix: "192.168.0.0/16"
        family: "ipv4"
        action: "permit"
        seq: "10"
      route_map:
        dut: "D1"
        name: "RM-SCALE"
        seq: "10"
        action: "deny"
        family: "ipv4"
        match:
          prefix_list: "DENY_SUBSET"
    verify:
      session_stable: true
      metrics_captured: true
      max_cpu_threshold: 80
      max_memory_increase: 20

  "4.1.4.7":
    title: "Concurrent policy changes from both peers and refresh behavior"
    description: "Test simultaneous policy changes on both sides and ensure route-refresh requests are handled gracefully."
    setup:
      d1_bgp:
        dut: "D1"
        local_asn: 65001
        vrf: "default"
        router_id: "1.1.1.1"
      d2_bgp:
        dut: "D2"
        local_asn: 65002
        vrf: "default"
        router_id: "2.2.2.2"
      d1_neighbor:
        dut: "D1"
        local_asn: 65001
        neighbor_ip: "10.1.1.2"
        remote_asn: 65002
        family: "ipv4"
        vrf: "default"
      d2_neighbor:
        dut: "D2"
        local_asn: 65002
        neighbor_ip: "10.1.1.1"
        remote_asn: 65001
        family: "ipv4"
        vrf: "default"
      d1_network:
        dut: "D1"
        local_asn: 65001
        network: "172.16.0.0/24"
        family: "ipv4"
      d2_network:
        dut: "D2"
        local_asn: 65002
        network: "192.168.100.0/24"
        family: "ipv4"
    policy:
      d1_prefix_list:
        dut: "D1"
        name: "TEST1"
        prefix: "192.168.100.0/24"
        family: "ipv4"
        action: "permit"
        seq: "10"
      d1_route_map:
        dut: "D1"
        name: "RM-D1-IN"
        seq: "10"
        action: "deny"
        family: "ipv4"
        match:
          prefix_list: "TEST1"
      d2_prefix_list:
        dut: "D2"
        name: "TEST2"
        prefix: "172.16.0.0/24"
        family: "ipv4"
        action: "permit"
        seq: "10"
      d2_route_map:
        dut: "D2"
        name: "RM-D2-IN"
        seq: "10"
        action: "deny"
        family: "ipv4"
        match:
          prefix_list: "TEST2"
    verify:
      concurrent_refresh: true
      session_stable: true
      deterministic_state: true

  "4.1.4.8":
    title: "Negative: malformed route-refresh or unsupported refresh subtype"
    description: "Ensure DUT handles unexpected/malformed route-refresh requests robustly."
    setup:
      d1_bgp:
        dut: "D1"
        local_asn: 65001
        vrf: "default"
        router_id: "1.1.1.1"
      d2_bgp:
        dut: "D2"
        local_asn: 65002
        vrf: "default"
        router_id: "2.2.2.2"
      d1_neighbor:
        dut: "D1"
        local_asn: 65001
        neighbor_ip: "10.1.1.2"
        remote_asn: 65002
        family: "ipv4"
        vrf: "default"
      d2_neighbor:
        dut: "D2"
        local_asn: 65002
        neighbor_ip: "10.1.1.1"
        remote_asn: 65001
        family: "ipv4"
        vrf: "default"
    test_type: "negative"
    verify:
      no_crash: true
      session_handling: "graceful"
      error_logging: true

  "4.1.4.9":
    title: "Route-refresh interaction with route-refresh capability negotiation"
    description: "Verify the session capability exchange is respected when capabilities differ."
    setup:
      d1_bgp:
        dut: "D1"
        local_asn: 65001
        vrf: "default"
        router_id: "1.1.1.1"
      d2_bgp:

# BGP Test ID 2.4.7 - Session Stability After Reload
# Variables for test_bgp_session_stability_after_reload.py
#
# This YAML file contains all test parameters for BGP session stability testing
# after various reload operations (BGP restart, config reload, graceful restart).
#
# Topology: 2-node testbed (testbed_vs_2node.yaml)
#   DUT1 (smic_sonic1) <--Ethernet4--> DUT2 (smic_sonic2)

defaults:
  cli_type: klish
  verify_timeout: 90
  cleanup: true
  min_topology:
    - "D1D2:1"

  # SLO requirements (in seconds)
  establish_timeout_s: 90
  downtime_slo_s: 30
  graceful_restart_time_s: 120
  config_reload_timeout_s: 300

  # Feature flags
  bfd_enabled: true
  graceful_restart_enabled: true

# Network addressing
network:
  # eBGP AS numbers
  asn_ebgp_dut1: 65001
  asn_ebgp_dut2: 65002
  asn_ibgp: 65001

  # Link IPs (IPv4)
  dut1_link_ip_v4: "10.0.0.1/30"
  dut2_link_ip_v4: "10.0.0.2/30"
  dut1_link_ip_v4_addr: "10.0.0.1"
  dut2_link_ip_v4_addr: "10.0.0.2"

  # Link IPs (IPv6)
  dut1_link_ip_v6: "2001:db8:10::1/64"
  dut2_link_ip_v6: "2001:db8:10::2/64"
  dut1_link_ip_v6_addr: "2001:db8:10::1"
  dut2_link_ip_v6_addr: "2001:db8:10::2"

  # Loopback IPs (IPv4)
  dut1_lo_v4: "1.1.1.1/32"
  dut2_lo_v4: "2.2.2.2/32"
  dut1_lo_v4_addr: "1.1.1.1"
  dut2_lo_v4_addr: "2.2.2.2"

  # Loopback IPs (IPv6)
  dut1_lo_v6: "2001:db8:1::1/128"
  dut2_lo_v6: "2001:db8:2::1/128"
  dut1_lo_v6_addr: "2001:db8:1::1"
  dut2_lo_v6_addr: "2001:db8:2::1"

  # Router IDs
  dut1_router_id: "1.1.1.1"
  dut2_router_id: "2.2.2.2"

  # Interface name
  link_interface: "Ethernet4"
  loopback_interface: "Loopback0"

# Test cases
testcases:
  "2.4.7.1":
    id: "2.4.7.1"
    title: "IPv4 eBGP numbered (/30) – BGP process restart on DUT1"
    description: "Verify BGP session re-establishes after BGP process restart with minimal downtime"
    reload_type: "bgp_restart"
    reload_dut: "D1"
    session_type: "ebgp_ipv4"
    config:
      D1:
        local_asn: 65001
        router_id: "1.1.1.1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1/30"
        neighbor_ip: "10.0.0.2"
        neighbor_asn: 65002
        address_family: "ipv4"
      D2:
        local_asn: 65002
        router_id: "2.2.2.2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2/30"
        neighbor_ip: "10.0.0.1"
        neighbor_asn: 65001
        address_family: "ipv4"
    expected_recovery_time: 30
    verify_state: "Established"

  "2.4.7.2":
    id: "2.4.7.2"
    title: "IPv4 eBGP numbered (/30) – BGP process restart on DUT2 (peer side)"
    description: "Verify BGP session recovers when peer-side BGP process restarts"
    reload_type: "bgp_restart"
    reload_dut: "D2"
    session_type: "ebgp_ipv4"
    config:
      D1:
        local_asn: 65001
        router_id: "1.1.1.1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1/30"
        neighbor_ip: "10.0.0.2"
        neighbor_asn: 65002
        address_family: "ipv4"
      D2:
        local_asn: 65002
        router_id: "2.2.2.2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2/30"
        neighbor_ip: "10.0.0.1"
        neighbor_asn: 65001
        address_family: "ipv4"
    expected_recovery_time: 30
    verify_state: "Established"

  "2.4.7.3":
    id: "2.4.7.3"
    title: "IPv4 iBGP numbered (/30) – BGP process restart on DUT1"
    description: "Verify iBGP session persistence after BGP process restart"
    reload_type: "bgp_restart"
    reload_dut: "D1"
    session_type: "ibgp_ipv4"
    config:
      D1:
        local_asn: 65001
        router_id: "1.1.1.1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1/30"
        neighbor_ip: "10.0.0.2"
        neighbor_asn: 65001
        address_family: "ipv4"
      D2:
        local_asn: 65001
        router_id: "2.2.2.2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2/30"
        neighbor_ip: "10.0.0.1"
        neighbor_asn: 65001
        address_family: "ipv4"
    expected_recovery_time: 30
    verify_state: "Established"

  "2.4.7.4":
    id: "2.4.7.4"
    title: "IPv4 eBGP numbered (/30) – config reload on DUT1"
    description: "Verify BGP session persists after config reload operation"
    reload_type: "config_reload"
    reload_dut: "D1"
    session_type: "ebgp_ipv4"
    save_config: true
    config:
      D1:
        local_asn: 65001
        router_id: "1.1.1.1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1/30"
        neighbor_ip: "10.0.0.2"
        neighbor_asn: 65002
        address_family: "ipv4"
      D2:
        local_asn: 65002
        router_id: "2.2.2.2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2/30"
        neighbor_ip: "10.0.0.1"
        neighbor_asn: 65001
        address_family: "ipv4"
    expected_recovery_time: 60
    verify_state: "Established"

  "2.4.7.5":
    id: "2.4.7.5"
    title: "IPv4 eBGP multihop – graceful restart after BGP process restart"
    description: "Verify graceful restart allows session to survive BGP process restart with minimal disruption"
    reload_type: "bgp_restart"
    reload_dut: "D1"
    session_type: "ebgp_ipv4_multihop"
    graceful_restart: true
    config:
      D1:
        local_asn: 65001
        router_id: "1.1.1.1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1/30"
        loopback_ip: "1.1.1.1/32"
        neighbor_ip: "2.2.2.2"
        neighbor_asn: 65002
        address_family: "ipv4"
        update_source: "Loopback0"
        ebgp_multihop: 2
        static_route:
          destination: "2.2.2.2/32"
          nexthop: "10.0.0.2"
      D2:
        local_asn: 65002
        router_id: "2.2.2.2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2/30"
        loopback_ip: "2.2.2.2/32"
        neighbor_ip: "1.1.1.1"
        neighbor_asn: 65001
        address_family: "ipv4"
        update_source: "Loopback0"
        ebgp_multihop: 2
        static_route:
          destination: "1.1.1.1/32"
          nexthop: "10.0.0.1"
    expected_recovery_time: 120
    verify_state: "Established"

  "2.4.7.6":
    id: "2.4.7.6"
    title: "IPv4 eBGP with BFD – BGP process restart"
    description: "Verify BFD-enabled BGP session recovers after BGP process restart"
    reload_type: "bgp_restart"
    reload_dut: "D1"
    session_type: "ebgp_ipv4_bfd"
    bfd_enabled: true
    config:
      D1:
        local_asn: 65001
        router_id: "1.1.1.1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1/30"
        neighbor_ip: "10.0.0.2"
        neighbor_asn: 65002
        address_family: "ipv4"
        bfd: true
      D2:
        local_asn: 65002
        router_id: "2.2.2.2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2/30"
        neighbor_ip: "10.0.0.1"
        neighbor_asn: 65001
        address_family: "ipv4"
        bfd: true
    expected_recovery_time: 30
    verify_state: "Established"

  "2.4.7.7":
    id: "2.4.7.7"
    title: "IPv6 eBGP numbered (/64) – BGP process restart on DUT1"
    description: "Verify IPv6 BGP session stability after BGP process restart"
    reload_type: "bgp_restart"
    reload_dut: "D1"
    session_type: "ebgp_ipv6"
    config:
      D1:
        local_asn: 65001
        router_id: "1.1.1.1"
        interface: "Ethernet4"
        ipv6_address: "2001:db8:10::1/64"
        neighbor_ip: "2001:db8:10::2"
        neighbor_asn: 65002
        address_family: "ipv6"
      D2:
        local_asn: 65002
        router_id: "2.2.2.2"
        interface: "Ethernet4"
        ipv6_address: "2001:db8:10::2/64"
        neighbor_ip: "2001:db8:10::1"
        neighbor_asn: 65001
        address_family: "ipv6"
    expected_recovery_time: 30
    verify_state: "Established"

  "2.4.7.8":
    id: "2.4.7.8"
    title: "IPv4 eBGP – warm restart (save/reload) maintains session config"
    description: "Verify BGP configuration persists across warm restart"
    reload_type: "config_reload"
    reload_dut: "D1"
    session_type: "ebgp_ipv4"
    save_config: true
    config:
      D1:
        local_asn: 65001
        router_id: "1.1.1.1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1/30"
        neighbor_ip: "10.0.0.2"
        neighbor_asn: 65002
        neighbor_description: "Test neighbor for reload"
        address_family: "ipv4"
      D2:
        local_asn: 65002
        router_id: "2.2.2.2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2/30"
        neighbor_ip: "10.0.0.1"
        neighbor_asn: 65001
        address_family: "ipv4"
    expected_recovery_time: 60
    verify_state: "Established"
    verify_description: "Test neighbor for reload"

  "2.4.7.9":
    id: "2.4.7.9"
    title: "Multiple BGP sessions – simultaneous process restart"
    description: "Verify multiple BGP sessions (eBGP) all recover after single BGP restart"
    reload_type: "bgp_restart"
    reload_dut: "D1"
    session_type: "ebgp_ipv4"
    config:
      D1:
        local_asn: 65001
        router_id: "1.1.1.1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1/30"
        neighbor_ip: "10.0.0.2"
        neighbor_asn: 65002
        neighbor_description: "eBGP peer"
        address_family: "ipv4"
      D2:
        local_asn: 65002
        router_id: "2.2.2.2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2/30"
        neighbor_ip: "10.0.0.1"
        neighbor_asn: 65001
        neighbor_description: "eBGP peer"
        address_family: "ipv4"
    expected_recovery_time: 30
    verify_state: "Established"

  "2.4.7.10":
    id: "2.4.7.10"
    title: "Negative – BGP restart with incorrect config (missing neighbor)"
    description: "Verify system behavior when BGP restarts with incomplete configuration"
    reload_type: "bgp_restart"
    reload_dut: "D1"
    session_type: "ebgp_ipv4"
    negative_test: true
    remove_neighbor_before_restart: true
    config:
      D1:
        local_asn: 65001
        router_id: "1.1.1.1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1/30"
        neighbor_ip: "10.0.0.2"
        neighbor_asn: 65002
        address_family: "ipv4"
      D2:
        local_asn: 65002
        router_id: "2.2.2.2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2/30"
        neighbor_ip: "10.0.0.1"
        neighbor_asn: 65001
        address_family: "ipv4"
    expected_recovery_time: 30
    verify_state: "Active"
    verify_no_neighbor_on_d1: true

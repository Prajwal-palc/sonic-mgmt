---
# BGP MD5 Authentication Test Variables - Test ID 2.4.6
# Variables for testcases validating BGP MD5/TCP-AO authentication

defaults:
  cli_type: klish
  verify_timeout: 90
  cleanup: true
  min_topology:
    - "D1D2:1"
  md5_ok: "bgpSecret1!"
  md5_bad: "bgpSecret2!"
  keepalive: 60
  hold: 180

testcases:
  "2.4.6.1":
    title: "IPv4 eBGP numbered (/30) – MD5 match then mismatch"
    description: "Session forms only when MD5 keys match on IPv4 eBGP"
    cli_type: "klish"
    setup:
      - type: "interface"
        dut: "D1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1"
        prefix_length: 30
        family: "ipv4"
      - type: "interface"
        dut: "D2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2"
        prefix_length: 30
        family: "ipv4"
      - type: "bgp_router"
        dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
      - type: "bgp_router"
        dut: "D2"
        local_asn: 65002
        router_id: "2.2.2.2"
      - type: "bgp_neighbor"
        dut: "D1"
        local_asn: 65001
        neighbor_ip: "10.0.0.2"
        remote_asn: 65002
        family: "ipv4"
      - type: "bgp_neighbor"
        dut: "D2"
        local_asn: 65002
        neighbor_ip: "10.0.0.1"
        remote_asn: 65001
        family: "ipv4"
    verify_initial:
      - dut: "D1"
        neighbor_ip: "10.0.0.2"
        family: "ipv4"
      - dut: "D2"
        neighbor_ip: "10.0.0.1"
        family: "ipv4"
    stimulus:
      dut: "D2"
      local_asn: 65002
      neighbor_ip: "10.0.0.1"
    verify_mismatch:
      - dut: "D1"
        neighbor_ip: "10.0.0.2"
        family: "ipv4"
      - dut: "D2"
        neighbor_ip: "10.0.0.1"
        family: "ipv4"

  "2.4.6.2":
    title: "IPv4 eBGP loopback multihop – MD5 match then mismatch"
    description: "Verify MD5 with eBGP multihop via loopbacks"
    cli_type: "klish"
    setup:
      - type: "loopback"
        dut: "D1"
        loopback: "Loopback0"
        ip_address: "1.1.1.1"
        prefix_length: 32
        family: "ipv4"
      - type: "loopback"
        dut: "D2"
        loopback: "Loopback0"
        ip_address: "2.2.2.2"
        prefix_length: 32
        family: "ipv4"
      - type: "interface"
        dut: "D1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1"
        prefix_length: 30
        family: "ipv4"
      - type: "interface"
        dut: "D2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2"
        prefix_length: 30
        family: "ipv4"
      - type: "static_route"
        dut: "D1"
        destination: "2.2.2.2/32"
        next_hop: "10.0.0.2"
        family: "ipv4"
      - type: "static_route"
        dut: "D2"
        destination: "1.1.1.1/32"
        next_hop: "10.0.0.1"
        family: "ipv4"
      - type: "bgp_router"
        dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
      - type: "bgp_router"
        dut: "D2"
        local_asn: 65002
        router_id: "2.2.2.2"
      - type: "bgp_neighbor"
        dut: "D1"
        local_asn: 65001
        neighbor_ip: "2.2.2.2"
        remote_asn: 65002
        family: "ipv4"
        update_source: "Loopback0"
        ebgp_multihop: 2
      - type: "bgp_neighbor"
        dut: "D2"
        local_asn: 65002
        neighbor_ip: "1.1.1.1"
        remote_asn: 65001
        family: "ipv4"
        update_source: "Loopback0"
        ebgp_multihop: 2
    verify_initial:
      - dut: "D1"
        neighbor_ip: "2.2.2.2"
        family: "ipv4"
      - dut: "D2"
        neighbor_ip: "1.1.1.1"
        family: "ipv4"
    stimulus:
      dut: "D2"
      local_asn: 65002
      neighbor_ip: "1.1.1.1"
    verify_mismatch:
      - dut: "D1"
        neighbor_ip: "2.2.2.2"
        family: "ipv4"
      - dut: "D2"
        neighbor_ip: "1.1.1.1"
        family: "ipv4"

  "2.4.6.3":
    title: "IPv6 eBGP numbered (/64) – AO/MD5 match then mismatch"
    description: "Session forms only when keys match on IPv6 peers (requires TCP-AO/MD5 support)"
    cli_type: "klish"
    setup:
      - type: "interface"
        dut: "D1"
        interface: "Ethernet4"
        ip_address: "2001:db8:10::1"
        prefix_length: 64
        family: "ipv6"
      - type: "interface"
        dut: "D2"
        interface: "Ethernet4"
        ip_address: "2001:db8:10::2"
        prefix_length: 64
        family: "ipv6"
      - type: "bgp_router"
        dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
      - type: "bgp_router"
        dut: "D2"
        local_asn: 65002
        router_id: "2.2.2.2"
      - type: "bgp_neighbor"
        dut: "D1"
        local_asn: 65001
        neighbor_ip: "2001:db8:10::2"
        remote_asn: 65002
        family: "ipv6"
      - type: "bgp_neighbor"
        dut: "D2"
        local_asn: 65002
        neighbor_ip: "2001:db8:10::1"
        remote_asn: 65001
        family: "ipv6"
    verify_initial:
      - dut: "D1"
        neighbor_ip: "2001:db8:10::2"
        family: "ipv6"
      - dut: "D2"
        neighbor_ip: "2001:db8:10::1"
        family: "ipv6"
    stimulus:
      dut: "D2"
      local_asn: 65002
      neighbor_ip: "2001:db8:10::1"
    verify_mismatch:
      - dut: "D1"
        neighbor_ip: "2001:db8:10::2"
        family: "ipv6"
      - dut: "D2"
        neighbor_ip: "2001:db8:10::1"
        family: "ipv6"

  "2.4.6.4":
    title: "IPv6 eBGP loopback multihop – AO/MD5 match then mismatch"
    description: "Verify AO/MD5 with IPv6 eBGP over loopbacks"
    cli_type: "klish"
    setup:
      - type: "loopback"
        dut: "D1"
        loopback: "Loopback0"
        ip_address: "2001:db8:1::1"
        prefix_length: 128
        family: "ipv6"
      - type: "loopback"
        dut: "D2"
        loopback: "Loopback0"
        ip_address: "2001:db8:2::1"
        prefix_length: 128
        family: "ipv6"
      - type: "interface"
        dut: "D1"
        interface: "Ethernet4"
        ip_address: "2001:db8:10::1"
        prefix_length: 64
        family: "ipv6"
      - type: "interface"
        dut: "D2"
        interface: "Ethernet4"
        ip_address: "2001:db8:10::2"
        prefix_length: 64
        family: "ipv6"
      - type: "static_route"
        dut: "D1"
        destination: "2001:db8:2::1/128"
        next_hop: "2001:db8:10::2"
        family: "ipv6"
      - type: "static_route"
        dut: "D2"
        destination: "2001:db8:1::1/128"
        next_hop: "2001:db8:10::1"
        family: "ipv6"
      - type: "bgp_router"
        dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
      - type: "bgp_router"
        dut: "D2"
        local_asn: 65002
        router_id: "2.2.2.2"
      - type: "bgp_neighbor"
        dut: "D1"
        local_asn: 65001
        neighbor_ip: "2001:db8:2::1"
        remote_asn: 65002
        family: "ipv6"
        update_source: "Loopback0"
        ebgp_multihop: 2
      - type: "bgp_neighbor"
        dut: "D2"
        local_asn: 65002
        neighbor_ip: "2001:db8:1::1"
        remote_asn: 65001
        family: "ipv6"
        update_source: "Loopback0"
        ebgp_multihop: 2
    verify_initial:
      - dut: "D1"
        neighbor_ip: "2001:db8:2::1"
        family: "ipv6"
      - dut: "D2"
        neighbor_ip: "2001:db8:1::1"
        family: "ipv6"
    stimulus:
      dut: "D2"
      local_asn: 65002
      neighbor_ip: "2001:db8:1::1"
    verify_mismatch:
      - dut: "D1"
        neighbor_ip: "2001:db8:2::1"
        family: "ipv6"
      - dut: "D2"
        neighbor_ip: "2001:db8:1::1"
        family: "ipv6"

  "2.4.6.5":
    title: "IPv4 iBGP rekey – coordinated rotate without prolonged downtime"
    description: "Demonstrate safe MD5 key rotation: add new key, switch, remove old"
    cli_type: "klish"
    setup:
      - type: "interface"
        dut: "D1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1"
        prefix_length: 30
        family: "ipv4"
      - type: "interface"
        dut: "D2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2"
        prefix_length: 30
        family: "ipv4"
      - type: "bgp_router"
        dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
      - type: "bgp_router"
        dut: "D2"
        local_asn: 65001
        router_id: "2.2.2.2"
      - type: "bgp_neighbor"
        dut: "D1"
        local_asn: 65001
        neighbor_ip: "10.0.0.2"
        remote_asn: 65001
        family: "ipv4"
      - type: "bgp_neighbor"
        dut: "D2"
        local_asn: 65001
        neighbor_ip: "10.0.0.1"
        remote_asn: 65001
        family: "ipv4"
    precheck:
      - dut: "D1"
        neighbor_ip: "10.0.0.2"
        family: "ipv4"
      - dut: "D2"
        neighbor_ip: "10.0.0.1"
        family: "ipv4"
    rekey_steps:
      - dut: "D2"
        local_asn: 65001
        neighbor_ip: "10.0.0.1"
      - dut: "D1"
        local_asn: 65001
        neighbor_ip: "10.0.0.2"
    verify_rekey:
      - dut: "D1"
        neighbor_ip: "10.0.0.2"
        family: "ipv4"
      - dut: "D2"
        neighbor_ip: "10.0.0.1"
        family: "ipv4"

  "2.4.6.6":
    title: "Negative – remove MD5 on one side only (IPv4 eBGP)"
    description: "Session must not establish if one side lacks MD5 key"
    cli_type: "klish"
    setup:
      - type: "interface"
        dut: "D1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1"
        prefix_length: 30
        family: "ipv4"
      - type: "interface"
        dut: "D2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2"
        prefix_length: 30
        family: "ipv4"
      - type: "bgp_router"
        dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
      - type: "bgp_router"
        dut: "D2"
        local_asn: 65002
        router_id: "2.2.2.2"
      - type: "bgp_neighbor"
        dut: "D1"
        local_asn: 65001
        neighbor_ip: "10.0.0.2"
        remote_asn: 65002
        family: "ipv4"
        has_password: true
      - type: "bgp_neighbor"
        dut: "D2"
        local_asn: 65002
        neighbor_ip: "10.0.0.1"
        remote_asn: 65001
        family: "ipv4"
        has_password: false
    verify:
      - dut: "D1"
        neighbor_ip: "10.0.0.2"
        family: "ipv4"
      - dut: "D2"
        neighbor_ip: "10.0.0.1"
        family: "ipv4"

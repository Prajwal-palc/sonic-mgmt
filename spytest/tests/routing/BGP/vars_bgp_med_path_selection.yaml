# BGP Test ID 3.1.2: MED Path Selection
# Variables for test_bgp_med_path_selection.py

defaults:
  cli_type: klish  # Configuration uses klish, show commands use click
  show_cli_type: click
  verify_timeout: 60
  cleanup: true
  min_topology:
    - "D1D2:1"

# Topology-specific settings
# Based on testbed_vs_2node.yaml:
# - smic_sonic1 (D1) <-> smic_sonic2 (D2) via Ethernet4
topology:
  D1:
    name: "smic_sonic1"
    as_number: 65001
    router_id: "1.1.1.1"
    interfaces:
      - name: "Ethernet4"
        ipv4: "10.0.24.1/31"
        ipv6: "2001:db8:24::1/64"
      - name: "Loopback0"
        ipv4: "1.1.1.1/32"
        ipv6: "2001:db8:1::1/128"
      - name: "Loopback1"
        ipv4: "10.1.1.1/32"
      - name: "Loopback2"
        ipv4: "10.1.2.1/32"

  D2:
    name: "smic_sonic2"
    as_number: 65002
    router_id: "2.2.2.2"
    interfaces:
      - name: "Ethernet4"
        ipv4: "10.0.24.0/31"
        ipv6: "2001:db8:24::2/64"
      - name: "Loopback0"
        ipv4: "2.2.2.2/32"
        ipv6: "2001:db8:2::2/128"
      - name: "Loopback10"
        ipv4: "10.2.10.1/32"
      - name: "Loopback11"
        ipv4: "10.2.11.1/32"

# Test prefixes for advertisement
test_prefixes:
  ipv4:
    - "198.51.110.0/24"  # TC 3.1.2.1
    - "198.51.120.0/24"  # TC 3.1.2.2
    - "198.51.130.0/24"  # TC 3.1.2.3
    - "198.51.140.0/24"  # TC 3.1.2.4
    - "198.51.150.0/24"  # TC 3.1.2.5
    - "198.51.160.0/24"  # TC 3.1.2.6
    - "198.51.170.0/24"  # TC 3.1.2.7
    - "198.51.180.0/24"  # TC 3.1.2.10
  ipv6:
    - "2001:db8:110::/64"  # TC 3.1.2.8

# Test cases configuration
testcases:
  "3.1.2.1":
    title: "Basic MED preference (two eBGP peers, IPv4)"
    description: "Verify lower MED is preferred when all earlier attributes tie"
    timeout: 60
    setup:
      # Simulate two different AS peers advertising same prefix with different MEDs
      # D2 will advertise with two different loopbacks (simulating different peers)
      peers:
        - dut: "D2"
          loopback: "Loopback10"
          prefix: "198.51.110.0/24"
          med: 200
          local_pref: 100
          as_path_prepend: []
        - dut: "D2"
          loopback: "Loopback11"
          prefix: "198.51.110.0/24"
          med: 100
          local_pref: 100
          as_path_prepend: []
    verify:
      dut: "D1"
      prefix: "198.51.110.0/24"
      expected_med: 100
      expected_selected: true

  "3.1.2.2":
    title: "MED tie with AS-PATH difference (AS-PATH shorter wins over MED)"
    description: "Validate AS-PATH is considered before MED"
    timeout: 60
    setup:
      peers:
        - dut: "D2"
          loopback: "Loopback10"
          prefix: "198.51.120.0/24"
          med: 500
          as_path_prepend: ["65200"]  # AS-PATH length 2 (65002, 65200)
        - dut: "D2"
          loopback: "Loopback11"
          prefix: "198.51.120.0/24"
          med: 100
          as_path_prepend: ["65300", "65400", "65500"]  # AS-PATH length 4
    verify:
      dut: "D1"
      prefix: "198.51.120.0/24"
      expected_as_path_length: 2  # Shorter AS-PATH should win
      expected_med: 500

  "3.1.2.3":
    title: "LOCAL_PREF overrides MED (LOCAL_PREF precedence)"
    description: "Demonstrate LOCAL_PREF takes precedence over MED"
    timeout: 60
    setup:
      peers:
        - dut: "D2"
          loopback: "Loopback10"
          prefix: "198.51.130.0/24"
          med: 1000
          local_pref: 200
          as_path_prepend: []
        - dut: "D2"
          loopback: "Loopback11"
          prefix: "198.51.130.0/24"
          med: 10
          local_pref: 100
          as_path_prepend: []
    verify:
      dut: "D1"
      prefix: "198.51.130.0/24"
      expected_local_pref: 200  # Higher local_pref should win
      expected_med: 1000

  "3.1.2.4":
    title: "MED propagation across eBGP/iBGP"
    description: "Verify MED propagation behavior"
    timeout: 120
    setup:
      # D2 advertises prefix with MED to D1
      # Check how MED is propagated
      peers:
        - dut: "D2"
          loopback: "Loopback10"
          prefix: "198.51.140.0/24"
          med: 50
          as_path_prepend: []
    verify:
      dut: "D1"
      prefix: "198.51.140.0/24"
      expected_med: 50
      check_propagation: true

  "3.1.2.5":
    title: "MED comparison only for routes from same neighboring AS"
    description: "Confirm MED scope is limited to same neighboring AS"
    timeout: 60
    setup:
      # Configure D1 to receive routes from different ASes
      # D2 will simulate different ASes via AS-PATH manipulation
      peers:
        - dut: "D2"
          loopback: "Loopback10"
          prefix: "198.51.150.0/24"
          med: 20
          as_path_prepend: []  # From AS 65002
        - dut: "D2"
          loopback: "Loopback11"
          prefix: "198.51.150.0/24"
          med: 10
          as_path_prepend: ["65300"]  # From AS 65300 (different AS)
    verify:
      dut: "D1"
      prefix: "198.51.150.0/24"
      check_med_scope: true
      note: "MED should not be compared across different neighboring ASes"

  "3.1.2.6":
    title: "MED effect with route-reflector (RR) and next-hop preservation"
    description: "Verify RR behavior with MED"
    timeout: 120
    skip: true  # Requires 3+ nodes for RR topology
    skip_reason: "Route-reflector requires 3+ node topology"

  "3.1.2.7":
    title: "MED set via route-map on import/export"
    description: "Validate policy-driven MED setting"
    timeout: 90
    setup:
      peers:
        - dut: "D2"
          loopback: "Loopback10"
          prefix: "198.51.170.0/24"
          med: 5  # Set via route-map
          route_map: "SET_MED_5"
        - dut: "D2"
          loopback: "Loopback11"
          prefix: "198.51.170.0/24"
          med: 200  # Set via route-map
          route_map: "SET_MED_200"
    verify:
      dut: "D1"
      prefix: "198.51.170.0/24"
      expected_med: 5
      expected_selected: true

  "3.1.2.8":
    title: "IPv6 MED behavior"
    description: "Verify MED semantics for IPv6 routes"
    timeout: 90
    setup:
      peers:
        - dut: "D2"
          loopback: "Loopback10"
          prefix: "2001:db8:110::/64"
          med: 300
          family: "ipv6"
          as_path_prepend: []
        - dut: "D2"
          loopback: "Loopback11"
          prefix: "2001:db8:110::/64"
          med: 50
          family: "ipv6"
          as_path_prepend: []
    verify:
      dut: "D1"
      prefix: "2001:db8:110::/64"
      family: "ipv6"
      expected_med: 50
      expected_selected: true

  "3.1.2.9":
    title: "Negative: invalid MED values and policy rejection"
    description: "Ensure invalid MED values are rejected"
    timeout: 30
    negative: true
    setup:
      invalid_meds:
        - value: -100
          expected_result: "rejected"
        - value: 4294967296  # 2^32, out of range
          expected_result: "rejected_or_clamped"
    verify:
      check_error_handling: true

  "3.1.2.10":
    title: "Persistence and convergence: MED changes"
    description: "Measure convergence time for MED changes"
    timeout: 300
    setup:
      initial_state:
        dut: "D2"
        loopback: "Loopback10"
        prefix: "198.51.180.0/24"
        med: 100
      changed_state:
        med: 1000
    verify:
      dut: "D1"
      prefix: "198.51.180.0/24"
      measure_convergence: true
      max_convergence_time: 10  # seconds

# Route-map configurations
route_maps:
  SET_MED_5:
    sequence: 10
    action: permit
    set:
      metric: 5

  SET_MED_200:
    sequence: 10
    action: permit
    set:
      metric: 200

  SET_MED_100:
    sequence: 10
    action: permit
    set:
      metric: 100

  SET_MED_1000:
    sequence: 10
    action: permit
    set:
      metric: 1000

  SET_LP200_MED1000:
    sequence: 10
    action: permit
    set:
      metric: 1000
      local_preference: 200

  SET_LP100_MED10:
    sequence: 10
    action: permit
    set:
      metric: 10
      local_preference: 100

  ASPATH_SHORT_MED_HIGH:
    sequence: 10
    action: permit
    set:
      metric: 500
      as_path_prepend: ["65200"]

  ASPATH_LONG_MED_LOW:
    sequence: 10
    action: permit
    set:
      metric: 100
      as_path_prepend: ["65300", "65400", "65500"]

# BGP neighbor configurations
bgp_neighbors:
  D1_to_D2:
    local_dut: "D1"
    local_as: 65001
    neighbor_ip: "10.0.24.0"
    remote_as: 65002
    family: "ipv4"

  D1_to_D2_ipv6:
    local_dut: "D1"
    local_as: 65001
    neighbor_ip: "2001:db8:24::2"
    remote_as: 65002
    family: "ipv6"

  D2_to_D1:
    local_dut: "D2"
    local_as: 65002
    neighbor_ip: "10.0.24.1"
    remote_as: 65001
    family: "ipv4"

  D2_to_D1_ipv6:
    local_dut: "D2"
    local_as: 65002
    neighbor_ip: "2001:db8:24::1"
    remote_as: 65001
    family: "ipv6"

# Static routes for reachability
static_routes:
  D1:
    - destination: "10.2.10.1/32"
      next_hop: "10.0.24.0"
      description: "Route to D2 Loopback10"
    - destination: "10.2.11.1/32"
      next_hop: "10.0.24.0"
      description: "Route to D2 Loopback11"

  D2:
    - destination: "10.1.1.1/32"
      next_hop: "10.0.24.1"
      description: "Route to D1 Loopback1"
    - destination: "10.1.2.1/32"
      next_hop: "10.0.24.1"
      description: "Route to D1 Loopback2"

# Common BGP timers (for faster convergence in testing)
bgp_timers:
  keepalive: 3
  holdtime: 9
  connect_retry: 10

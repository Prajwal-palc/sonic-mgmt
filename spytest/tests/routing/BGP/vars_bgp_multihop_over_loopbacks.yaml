---
# BGP Multi-hop Over Loopbacks Test Variables - Test ID 2.4.8
# Variables for testcases validating BGP multi-hop configuration over loopbacks
# Reference topology: testbeds/testbed_vs_2node.yaml

defaults:
  cli_type: klish
  verify_timeout: 120
  cleanup: true
  min_topology:
    - "D1D2:1"
  keepalive: 60
  hold: 180

# ============================================================================
# Test ID 2.4.8.1: iBGP IPv4 Multi-hop Over Loopbacks (Basic)
# ============================================================================
testcases:
  "2.4.8.1":
    title: "iBGP IPv4 Multi-hop Over Loopbacks (Basic)"
    description: "Verify iBGP IPv4 session forms over loopbacks using multi-hop configuration"
    cli_type: "klish"
    setup:
      - type: "interface"
        dut: "D1"
        interface: "Ethernet4"
        ip_address: "10.0.0.1"
        prefix_length: 30
        family: "ipv4"
      - type: "interface"
        dut: "D2"
        interface: "Ethernet4"
        ip_address: "10.0.0.2"
        prefix_length: 30
        family: "ipv4"
      - type: "loopback"
        dut: "D1"
        loopback: "Loopback0"
        ip_address: "1.1.1.1"
        prefix_length: 32
        family: "ipv4"
      - type: "loopback"
        dut: "D2"
        loopback: "Loopback0"
        ip_address: "2.2.2.2"
        prefix_length: 32
        family: "ipv4"
      - type: "static_route"
        dut: "D1"
        destination: "2.2.2.2/32"
        next_hop: "10.0.0.2"
        family: "ipv4"
      - type: "static_route"
        dut: "D2"
        destination: "1.1.1.1/32"
        next_hop: "10.0.0.1"
        family: "ipv4"
      - type: "bgp_router"
        dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
      - type: "bgp_router"
        dut: "D2"
        local_asn: 65001
        router_id: "2.2.2.2"
      - type: "bgp_neighbor"
        dut: "D1"
        local_asn: 65001
        neighbor_ip: "2.2.2.2"
        remote_asn: 65001
        family: "ipv4"
        update_source: "Loopback0"
      - type: "bgp_neighbor"
        dut: "D2"
        local_asn: 65001
        neighbor_ip: "1.1.1.1"
        remote_asn: 65001
        family: "ipv4"
        update_source: "Loopback0"
    verify:
      - dut: "D1"
        neighbor_ip: "2.2.2.2"
        family: "ipv4"
        state: "Established"
      - dut: "D2"
        neighbor_ip: "1.1.1.1"
        family: "ipv4"
        state: "Established"


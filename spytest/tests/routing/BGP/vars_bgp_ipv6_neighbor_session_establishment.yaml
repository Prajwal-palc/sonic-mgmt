# BGP IPv6 Neighbor Session Establishment Test Variables
# Test ID 2.4.2 - All Sub-testcases (2.4.2.1 through 2.4.2.8)
# Reference: Doc/bgp_242.md

defaults:
  cli_type: "klish"  # BGP configuration requires klish/vtysh, not click
  verify_timeout: 120  # Seconds to wait for BGP session establishment
  cleanup: true  # Cleanup configuration after each test
  min_topology:
    - "D1D2:1"  # Minimum topology: 2 DUTs with 1 link
  keepalive: 60  # BGP keepalive timer (seconds)
  hold: 180  # BGP hold timer (seconds)

# ============================================================================
# Test ID 2.4.2.1: iBGP IPv6 Numbered (Loopback-Based)
# ============================================================================
testcases:
  "2.4.2.1":
    title: "iBGP IPv6 Numbered (Loopback-Based)"
    description: "Verify iBGP IPv6 neighbor session using numbered loopback addresses"
    interfaces:
      - dut: "D1"
        interface: "Ethernet4"
        ip_address: "2001:db8:24::1"
        prefix_length: 64
      - dut: "D2"
        interface: "Ethernet4"
        ip_address: "2001:db8:24::2"
        prefix_length: 64
    loopbacks:
      - dut: "D1"
        loopback: "Loopback0"
        ip_address: "2001:db8:1::1"
        prefix_length: 128
      - dut: "D2"
        loopback: "Loopback0"
        ip_address: "2001:db8:2::2"
        prefix_length: 128
    static_routes:
      - dut: "D1"
        destination: "2001:db8:2::2/128"
        next_hop: "2001:db8:24::2"
      - dut: "D2"
        destination: "2001:db8:1::1/128"
        next_hop: "2001:db8:24::1"
    bgp_routers:
      - dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
        vrf: "default"
      - dut: "D2"
        local_asn: 65001
        router_id: "2.2.2.2"
        vrf: "default"
    bgp_neighbors:
      - dut: "D1"
        local_asn: 65001
        neighbor_ip: "2001:db8:2::2"
        remote_asn: 65001
        update_source: "Loopback0"
        vrf: "default"
      - dut: "D2"
        local_asn: 65001
        neighbor_ip: "2001:db8:1::1"
        remote_asn: 65001
        update_source: "Loopback0"
        vrf: "default"

  # ============================================================================
  # Test ID 2.4.2.2: iBGP IPv6 Unnumbered (Loopback-Based)
  # ============================================================================
  "2.4.2.2":
    title: "iBGP IPv6 Unnumbered (Loopback-Based)"
    description: "Verify iBGP IPv6 neighbor session using IPv6 link-local with loopback"
    loopbacks:
      - dut: "D1"
        loopback: "Loopback0"
        ip_address: "2001:db8:1::1"
        prefix_length: 128
      - dut: "D2"
        loopback: "Loopback0"
        ip_address: "2001:db8:2::2"
        prefix_length: 128
    interfaces:
      - dut: "D1"
        interface: "Ethernet4"
        ip_address: "2001:db8:24::1"
        prefix_length: 64
      - dut: "D2"
        interface: "Ethernet4"
        ip_address: "2001:db8:24::2"
        prefix_length: 64
    static_routes: []
    bgp_routers:
      - dut: "D1"
        local_asn: 65001
        router_id: "1.1.1.1"
        vrf: "default"
      - dut: "D2"
        local_asn: 65001
        router_id: "2.2.2.2"
        vrf: "default"

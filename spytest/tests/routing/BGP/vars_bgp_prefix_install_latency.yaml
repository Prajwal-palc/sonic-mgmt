defaults:
  config_cli_type: klish
  show_cli_type: click
  verify_timeout: 60
  cleanup: true
  min_topology:
    - "D1D2:1"

testcases:
  "6.1.3.1":
    title: "Baseline prefix installation latency with no churn"
    description: >
      Establish baseline prefix installation latency with no churn.
      Measure single-prefix and bulk-prefix installation latency when routes
      are advertised once (no withdraws).

    bgp_config:
      dut1: "D1"
      dut2: "D2"

      # Interface configuration
      interface_dut1:
        name: "Ethernet4"
        ip_address: "10.0.24.0/31"

      interface_dut2:
        name: "Ethernet4"
        ip_address: "10.0.24.1/31"

      # BGP configuration for DUT1 (receiver)
      bgp_dut1:
        local_asn: 65001
        router_id: "1.1.1.1"
        neighbor_ip: "10.0.24.1"
        neighbor_asn: 65002

      # BGP configuration for DUT2 (route generator)
      bgp_dut2:
        local_asn: 65002
        router_id: "2.2.2.2"
        neighbor_ip: "10.0.24.0"
        neighbor_asn: 65001

    parameters:
      prefix_count: 100
      base_prefix: "192.168.0.0/24"
      add_rate_pps: 100
      withdraw_rate_pps: 0
      measurement_window_s: 60
      sla_ms_per_prefix: 50

  "6.1.3.2":
    title: "Low churn prefix installation"
    description: >
      Measure installation latency when prefixes are being added and withdrawn
      at low churn rate. Verify SLA under light churn conditions.

    bgp_config:
      dut1: "D1"
      dut2: "D2"

      # Interface configuration
      interface_dut1:
        name: "Ethernet4"
        ip_address: "10.0.24.0/31"

      interface_dut2:
        name: "Ethernet4"
        ip_address: "10.0.24.1/31"

      # BGP configuration for DUT1 (receiver)
      bgp_dut1:
        local_asn: 65001
        router_id: "1.1.1.1"
        neighbor_ip: "10.0.24.1"
        neighbor_asn: 65002

      # BGP configuration for DUT2 (route generator)
      bgp_dut2:
        local_asn: 65002
        router_id: "2.2.2.2"
        neighbor_ip: "10.0.24.0"
        neighbor_asn: 65001

    parameters:
      prefix_count: 1000
      base_prefix: "192.168.0.0/24"
      add_rate_pps: 200
      withdraw_rate_pps: 50
      churn_pattern: "cyclic"
      measurement_window_s: 120
      sla_ms_per_prefix: 100

  "6.1.3.3":
    title: "Medium churn prefix installation"
    description: >
      Measure behavior under moderate churn expected in production spikes.
      Verify SLA and stability for moderate add/withdraw rates.

    bgp_config:
      dut1: "D1"
      dut2: "D2"

      # Interface configuration
      interface_dut1:
        name: "Ethernet4"
        ip_address: "10.0.24.0/31"

      interface_dut2:
        name: "Ethernet4"
        ip_address: "10.0.24.1/31"

      # BGP configuration for DUT1 (receiver)
      bgp_dut1:
        local_asn: 65001
        router_id: "1.1.1.1"
        neighbor_ip: "10.0.24.1"
        neighbor_asn: 65002

      # BGP configuration for DUT2 (route generator)
      bgp_dut2:
        local_asn: 65002
        router_id: "2.2.2.2"
        neighbor_ip: "10.0.24.0"
        neighbor_asn: 65001

    parameters:
      prefix_count: 5000
      base_prefix: "192.168.0.0/24"
      add_rate_pps: 1000
      withdraw_rate_pps: 500
      churn_pattern: "randomized_bursts"
      measurement_window_s: 300
      sla_ms_per_prefix: 200

  "6.1.3.4":
    title: "High churn prefix installation (stress test)"
    description: >
      Test DUT under aggressive churn to map breaking points and tail latency.
      Measure tail latency and failure modes under heavy add/withdraw rates.
      WARNING: This is a disruptive stress test.

    bgp_config:
      dut1: "D1"
      dut2: "D2"

      # Interface configuration
      interface_dut1:
        name: "Ethernet4"
        ip_address: "10.0.24.0/31"

      interface_dut2:
        name: "Ethernet4"
        ip_address: "10.0.24.1/31"

      # BGP configuration for DUT1 (receiver)
      bgp_dut1:
        local_asn: 65001
        router_id: "1.1.1.1"
        neighbor_ip: "10.0.24.1"
        neighbor_asn: 65002

      # BGP configuration for DUT2 (route generator)
      bgp_dut2:
        local_asn: 65002
        router_id: "2.2.2.2"
        neighbor_ip: "10.0.24.0"
        neighbor_asn: 65001

    parameters:
      prefix_count: 20000
      base_prefix: "192.168.0.0/24"
      add_rate_pps: 5000
      withdraw_rate_pps: 4000
      churn_pattern: "continuous_high"
      measurement_window_s: 600
      sla_ms_per_prefix: 500

  "6.1.3.5":
    title: "Long duration stability under churn (soak test)"
    description: >
      Validate long-run stability and steady-state latency under intermittent churn.
      Ensure no memory leaks or degradation in installation latency over long runtime.
      WARNING: This test runs for 4 hours.

    bgp_config:
      dut1: "D1"
      dut2: "D2"

      # Interface configuration
      interface_dut1:
        name: "Ethernet4"
        ip_address: "10.0.24.0/31"

      interface_dut2:
        name: "Ethernet4"
        ip_address: "10.0.24.1/31"

      # BGP configuration for DUT1 (receiver)
      bgp_dut1:
        local_asn: 65001
        router_id: "1.1.1.1"
        neighbor_ip: "10.0.24.1"
        neighbor_asn: 65002

      # BGP configuration for DUT2 (route generator)
      bgp_dut2:
        local_asn: 65002
        router_id: "2.2.2.2"
        neighbor_ip: "10.0.24.0"
        neighbor_asn: 65001

    parameters:
      prefix_count: 5000
      base_prefix: "192.168.0.0/24"
      add_rate_pps: 500
      withdraw_rate_pps: 250
      churn_pattern: "intermittent_every_5_minutes"
      churn_interval_s: 300    # 5 minutes between bursts
      churn_duration_s: 30     # 30 second burst duration
      measurement_window_s: 14400  # 4 hours
      sla_ms_per_prefix: 150

# Notes:
# - All IP addresses and ASNs can be customized per deployment
# - SLA values (sla_ms_per_prefix) are example targets
# - Adjust prefix_count based on DUT capabilities
# - For virtual environments, consider reducing prefix counts
# - Ensure NTP synchronization for accurate latency measurements

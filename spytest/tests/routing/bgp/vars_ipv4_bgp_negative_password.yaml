---
# Variable file for IPv4 BGP Negative Test - Wrong Password Authentication
# Test: test_ipv4_bgp_negative_password.py
# Author: Athira
# © 2025, copyrights@SuperMicro

# Topology Configuration
topology:
  type: "2-node"
  description: "Two SONiC devices with iBGP peering over physical interfaces - Negative test with password mismatch"
  peering_type: "iBGP (same AS number)"

# IPv4 Configuration
ipv4:
  dut1_address: "10.1.1.1"
  dut2_address: "10.1.1.2"
  prefix_length: "24"
  address_family: "ipv4"

# iBGP Configuration
bgp:
  type: "ibgp"
  asn: "65001"
  router_id:
    dut1: "1.1.1.1"
    dut2: "2.2.2.2"
  wait_time: 90
  negative_test_wait: 90
  convergence_timeout: 90

# BGP Password Configuration
bgp_password:
  correct_password: "hello@123"
  wrong_password: "different@456"
  authentication_type: "MD5"
  description: "BGP password authentication for neighbor security"

# Negative Test Configuration
negative_test:
  correct_password: "hello@123"
  wrong_password: "different@456"
  description: "DUT1 will be configured with wrong password (different@456 instead of hello@123)"
  expected_behavior: "BGP session should NOT establish with password mismatch"
  expected_state: "Connect"
  reason: "MD5 password mismatch prevents TCP connection establishment"

# CLI Configuration
cli:
  type: "klish"
  shell: "vtysh"

# Interface Configuration
interface:
  mtu: "9100"
  speed: "40000"
  cleanup_before_config: true

# Test Parameters
test:
  ping_count: 5
  reboot_wait_time: 60
  bgp_wait_time: 90
  negative_test_wait_time: 90
  interface_wait_time: 2

# Show Commands Used
show_commands:
  bgp_summary: "show bgp summary"
  bgp_neighbors: "show bgp ipv4 unicast neighbors"
  bgp_neighbor_detail: "show bgp ipv4 unicast neighbors <neighbor-ip>"
  ipv6_interfaces: "show ip interfaces"
  ipv6_route: "show ip route"

# Test Scenarios
scenarios:
  correct_password_establish:
    description: "Verify BGP session establishes with correct matching password"
    steps:
      - "Check and remove existing IPv4 addresses"
      - "Configure interface MTU and speed"
      - "Configure IPv4 addresses on physical interfaces"
      - "Verify IPv4 connectivity"
      - "Remove existing BGP configuration (no router bgp)"
      - "Configure BGP with router IDs"
      - "Configure DUT1 neighbor with password hello@123"
      - "Configure DUT2 neighbor with password hello@123"
      - "Verify BGP sessions establish (Established state)"

  wrong_password_no_establish:
    description: "Verify BGP session does NOT establish with password mismatch"
    steps:
      - "Change DUT1 neighbor password to different@456"
      - "DUT2 neighbor password remains hello@123"
      - "Wait 90 seconds for any potential establishment"
      - "Verify BGP session does NOT establish"
      - "Verify DUT1 session in Connect state (password mismatch)"

  correct_password_after_fix:
    description: "Verify BGP session establishes after fixing password"
    steps:
      - "Change DUT1 neighbor password back to hello@123"
      - "Wait for BGP convergence"
      - "Verify BGP sessions re-establish successfully"
      - "Verify session state is Established"

# Configuration Examples
config_examples:
  interface:
    - "interface Ethernet32"
    - "mtu 9100"
    - "speed 40000"
    - "ip address 10.1.1.1/24"
    - "no shutdown"
    - "exit"

  bgp_router:
    - "router bgp 65001"
    - "router-id 1.1.1.1"
    - "exit"

  bgp_neighbor_with_password:
    - "router bgp 65001"
    - "neighbor 10.1.1.2 remote-as 65001"
    - "password hello@123"
    - "address-family ipv4 unicast"
    - "activate"
    - "exit"
    - "exit"

  bgp_neighbor_wrong_password:
    - "router bgp 65001"
    - "no neighbor 10.1.1.2"
    - "neighbor 10.1.1.2 remote-as 65001"
    - "password different@456"  # WRONG - doesn't match DUT2
    - "address-family ipv4 unicast"
    - "activate"
    - "exit"
    - "exit"

  bgp_neighbor_fix_password:
    - "router bgp 65001"
    - "no neighbor 10.1.1.2"
    - "neighbor 10.1.1.2 remote-as 65001"
    - "password hello@123"  # CORRECT - matches DUT2
    - "address-family ipv4 unicast"
    - "activate"
    - "exit"
    - "exit"

# Notes
notes:
  - "This is a NEGATIVE test - failure to establish with wrong password is the expected behavior"
  - "BGP password authentication uses MD5 hashing"
  - "DUT1 and DUT2 initially configured with matching password (hello@123)"
  - "BGP session establishes successfully with matching password"
  - "DUT1 password changed to different@456 (mismatch)"
  - "BGP session should drop and remain in Connect state"
  - "After fixing password on DUT1, session should re-establish"
  - "Password mismatch is detected at TCP connection level"
  - "No BGP OPEN messages exchanged when password doesn't match"
  - "Test uses physical interface peering (not loopback)"

# Expected Behavior
expected:
  correct_password:
    bgp_session_dut1: "Established"
    bgp_session_dut2: "Established"
    reason: "Passwords match on both sides (hello@123)"
    tcp_connection: "Established with MD5 authentication"

  wrong_password:
    bgp_session_dut1: "Connect"
    bgp_session_dut2: "Connect or Active"
    reason: "Password mismatch (DUT1: different@456, DUT2: hello@123)"
    tcp_connection: "Cannot establish due to MD5 authentication failure"

  after_fix:
    bgp_session_dut1: "Established"
    bgp_session_dut2: "Established"
    reason: "Passwords now match again (both: hello@123)"

# Verification Points
verification:
  correct_password_test:
    - "Physical IPv4 connectivity verified between DUTs"
    - "BGP configured on both DUTs"
    - "DUT1 neighbor configured with password hello@123"
    - "DUT2 neighbor configured with password hello@123"
    - "BGP sessions successfully establish"
    - "BGP state is Established on both DUTs"

  negative_test:
    - "DUT1 neighbor password changed to different@456"
    - "DUT2 neighbor password remains hello@123"
    - "Password mismatch created"
    - "BGP session does NOT reach Established state"
    - "BGP session remains in Connect state"
    - "TCP connection fails MD5 authentication"
    - "Negative validation passes (session failure is success)"

  positive_test_after_fix:
    - "DUT1 neighbor password changed back to hello@123"
    - "Passwords now match on both sides"
    - "BGP sessions successfully re-establish"
    - "BGP state is Established"
    - "Proves that password mismatch was the root cause"

# BGP Password Authentication
password_authentication:
  mechanism: "TCP MD5 Signature Option (RFC 2385)"
  purpose: "Protect BGP sessions from unauthorized neighbors"
  how_it_works:
    - "Password configured on both BGP neighbors"
    - "TCP segments signed with MD5 hash of password"
    - "Receiving side validates MD5 signature"
    - "If signature doesn't match, TCP segment rejected"
    - "BGP session cannot establish without matching password"
  security_benefits:
    - "Prevents unauthorized BGP peering"
    - "Protects against BGP hijacking"
    - "Adds authentication layer to BGP"
    - "Recommended for eBGP sessions"

# BGP State Machine with Password Mismatch
bgp_states_with_password:
  Idle: "Initial state"
  Connect: "Trying to establish TCP connection (stuck here with password mismatch)"
  Active: "TCP connection failed, trying again"
  OpenSent: "Never reached with password mismatch (TCP fails first)"
  OpenConfirm: "Never reached with password mismatch"
  Established: "Never reached with password mismatch"

# Common Password Issues
common_issues:
  - issue: "Password mismatch between neighbors"
    example: "DUT1: hello@123, DUT2: different@456"
    result: "BGP session stuck in Connect state"
    tested_in: "test_ipv4_bgp_password_mismatch"

  - issue: "Password configured on one side only"
    example: "DUT1: password configured, DUT2: no password"
    result: "BGP session cannot establish"

  - issue: "Case sensitivity in password"
    example: "DUT1: Hello@123, DUT2: hello@123"
    result: "BGP session cannot establish (case sensitive)"

  - issue: "Special characters in password"
    example: "Password contains spaces or special chars"
    result: "May require quotes or escaping"

  - issue: "Typo in password configuration"
    example: "DUT1: hello@123, DUT2: hello@1234 (typo)"
    result: "BGP session stuck in Connect state"

# BGP State Reference
bgp_states_reference:
  Idle: "Initial state, no connection attempt"
  Connect: "Waiting for TCP connection to complete (password mismatch causes stuck here)"
  Active: "Trying to establish TCP connection"
  OpenSent: "TCP connection established, OPEN message sent"
  OpenConfirm: "OPEN message received, waiting for KEEPALIVE"
  Established: "BGP session fully established"

# Why This Test is Important
importance:
  - "Validates BGP password authentication works correctly"
  - "Prevents configuration errors in production"
  - "Common mistake: password typo or mismatch during configuration"
  - "Security: Ensures unauthorized BGP neighbors cannot peer"
  - "Helps troubleshoot password-related BGP issues"
  - "Best practice: Always use password authentication for eBGP"
  - "Educational: Shows impact of password mismatch on BGP session"

# Troubleshooting Commands
troubleshooting:
  verify_password:
    - "show running-config | grep password"
    - "show bgp ipv4 unicast neighbors <neighbor-ip> | grep -i password"
    - "Note: Password itself is not visible in show commands"

  verify_bgp_state:
    - "show bgp summary"
    - "show bgp ipv4 unicast neighbors"
    - "show bgp ipv4 unicast neighbors <neighbor-ip>"

  verify_connectivity:
    - "ping6 <neighbor-ip>"
    - "show ip interface brief"

  verify_tcp:
    - "show tcp brief | grep 179"
    - "netstat -an | grep 179"

  bgp_logs:
    - "show logging | grep BGP"
    - "show logging | grep -i authentication"
    - "show logging | grep -i md5"

# How to Fix Password Mismatch
fix_procedure:
  step1: "Identify the issue"
  command1: "show bgp summary (check for Connect state)"
  step2: "Verify password is configured"
  command2: "show running-config | grep password"
  step3: "Contact peer to verify their password"
  command3: "Out-of-band communication (phone, email, etc.)"
  step4: "Remove and reconfigure neighbor with correct password"
  command4: "router bgp <asn> ; no neighbor <ip> ; neighbor <ip> remote-as <asn> ; password <correct-password>"
  step5: "Verify BGP session establishes"
  command5: "show bgp summary"

# Password Best Practices
best_practices:
  - "Use strong passwords (mix of letters, numbers, special chars)"
  - "Document passwords securely (password manager, encrypted storage)"
  - "Verify password with peer before configuration"
  - "Test password authentication in lab before production"
  - "Change passwords periodically for security"
  - "Use same password on both sides (obvious but often missed)"
  - "Be careful with case sensitivity"
  - "Use quotes if password contains spaces or special chars"
  - "Always configure password for eBGP sessions (security)"
  - "Consider password for iBGP in sensitive environments"

# Comparison: With Password vs Without Password
comparison:
  without_password:
    security: "Low - any device can attempt BGP peering"
    authentication: "None"
    use_case: "Internal iBGP in trusted network"
    risk: "BGP hijacking, unauthorized peering"

  with_password:
    security: "High - only devices with correct password can peer"
    authentication: "MD5 TCP signature"
    use_case: "eBGP with external peers, high-security environments"
    risk: "Low - unauthorized peering prevented"

# Related Test Cases
related_tests:
  - "test_ipv4_bgp_negative_asn.py - Negative test with wrong ASN"
  - "test_ipv4_bgp_loopback_negative_updatesource.py - Negative test with wrong update-source"
  - "test_ipv4_bgp_interface_physical.py - Positive test without password"
  - "test_ipv4_bgp_loopback.py - Positive test over loopback"

# Sample Output
sample_output:
  correct_password_established:
    command: "show bgp summary"
    output: |
      IPv4 Unicast Summary:
      BGP router identifier 1.1.1.1, local AS number 65001 VRF default vrf-id 0
      Neighbor        V         AS   MsgRcvd   MsgSent   TblVer  InQ OutQ  Up/Down State/PfxRcd
      10.1.1.2   4      65001        16        16        0    0    0 00:00:02            0

  wrong_password_connect:
    command: "show bgp summary"
    output: |
      IPv4 Unicast Summary:
      BGP router identifier 1.1.1.1, local AS number 65001 VRF default vrf-id 0
      Neighbor        V         AS   MsgRcvd   MsgSent   TblVer  InQ OutQ  Up/Down State/PfxRcd
      10.1.1.2   4      65001        13        13        0    0    0 00:00:18      Connect

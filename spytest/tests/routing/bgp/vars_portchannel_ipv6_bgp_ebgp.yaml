---
# Variable file for PortChannel IPv6 eBGP Test
# Test: test_portchannel_ipv6_bgp_ebgp.py
# Author: Athira
# © 2025, copyrights@SuperMicro

# PortChannel Configuration
portchannel:
  name: "PortChannel10"
  id: "10"
  mode: "LACP"
  mtu: "9100"

# IPv6 Configuration
ipv6:
  dut1_address: "2001:db8:20::1"
  dut2_address: "2001:db8:20::2"
  prefix_length: "64"
  address_family: "ipv6"

# eBGP Configuration (External BGP - Different AS Numbers)
bgp:
  type: "ebgp"  # External BGP
  dut1:
    asn: "65001"
    router_id: "1.1.1.1"
  dut2:
    asn: "65002"
    router_id: "2.2.2.2"
  wait_time: 90
  convergence_timeout: 90

# CLI Configuration
cli:
  type: "klish"
  shell: "vtysh"

# Test Parameters
test:
  ping_count: 5
  reboot_wait_time: 60
  bgp_wait_time: 90
  interface_wait_time: 5
  portchannel_stabilize_time: 5

# Expected BGP States (for validation)
bgp_states:
  valid_states:
    - "Established"
    - "(Policy)"  # Session established but policies are applied
    - "0"  # Numeric state indicating established
    - "1"
  description: "BGP session is considered established if state is 'Established', '(Policy)', or a numeric value indicating active peering"

# Topology Information
topology:
  type: "2-node"
  description: "Two SONiC devices connected via PortChannel10"
  dut1_port: "Ethernet32"  # Will be overridden by testbed
  dut2_port: "Ethernet32"  # Will be overridden by testbed
  link_aggregation: true

# Test Scenarios
scenarios:
  basic_config:
    description: "Basic eBGP configuration and verification over PortChannel"
    steps:
      - "Create PortChannel10"
      - "Add Ethernet32 as member"
      - "Configure IPv6 addresses on PortChannel"
      - "Configure eBGP with different ASN (65001 <-> 65002)"
      - "Verify BGP session (Established or Policy)"
      - "Test IPv6 connectivity (click and klish CLI)"

  save_reboot:
    description: "Configuration persistence after save and reboot"
    steps:
      - "Verify eBGP session"
      - "Verify IPv6 connectivity"
      - "Check BGP routes"
      - "Save configuration"
      - "Reboot DUTs"
      - "Verify PortChannel status after reboot"
      - "Verify eBGP session after reboot"
      - "Verify IPv6 connectivity after reboot"

# Notes
notes:
  - "This test uses eBGP (External BGP) with different AS numbers (65001 and 65002)"
  - "PortChannel provides link aggregation for higher bandwidth and redundancy"
  - "BGP validation accepts (Policy) state as valid established state"
  - "Route policies may filter prefixes, resulting in (Policy) state"
  - "Test uses Klish CLI for configuration and validation"
  - "IPv6 connectivity tested using both click and klish CLI ping"
  - "PortChannel operates in LACP mode for dynamic link aggregation"

# Expected Behavior
expected:
  portchannel_status: "up"
  bgp_session_state: "Established or (Policy)"
  ipv6_ping: "success"
  post_reboot_convergence: "All services restore automatically"

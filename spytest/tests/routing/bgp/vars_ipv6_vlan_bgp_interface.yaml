# Variables file for IPv6 VLAN BGP Interface test
# Author: Athira
# © 2025, copyrights@SuperMicro

defaults:
  cli_type: klish
  min_topology:
    - "D1D2:1"
  verify_timeout: 90
  reboot_wait_time: 60
  cleanup: true

# VLAN Configuration
vlan:
  vlan_id: 100
  vlan_name: "Vlan100"

# DUT1 Configuration
dut1:
  ipv6_address: "2001:db8:100::1"
  ipv6_mask: "64"
  physical_interface: "Ethernet32"
  vlan_interface: "Vlan100"
  bgp_asn: 65001
  router_id: "1.1.1.1"

# DUT2 Configuration
dut2:
  ipv6_address: "2001:db8:100::2"
  ipv6_mask: "64"
  physical_interface: "Ethernet32"
  vlan_interface: "Vlan100"
  bgp_asn: 65001
  router_id: "2.2.2.2"

# BGP Configuration
bgp:
  asn: 65001
  neighbor_wait_time: 90
  keepalive: 60
  holdtime: 180
  address_family: "ipv6 unicast"
  router_id_dut1: "1.1.1.1"
  router_id_dut2: "2.2.2.2"

# IPv6 Configuration
ipv6:
  subnet: "2001:db8:100::/64"
  ping_count: 5
  ping_timeout: 10

# Test Parameters
test_params:
  bgp_convergence_time: 90
  reboot_wait_time: 60
  config_save_wait: 5
  interface_up_wait: 10
  vlan_create_wait: 2

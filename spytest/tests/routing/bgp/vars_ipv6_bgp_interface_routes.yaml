---
# Variable file for IPv6 BGP Route Advertisement Test
# Test: test_ipv6_bgp_interface_routes.py
# Author: Athira
# © 2025, copyrights@SuperMicro

# IPv6 Configuration
ipv6:
  dut1_address: "2001:db8:20::1"
  dut2_address: "2001:db8:20::2"
  prefix_length: "64"
  address_family: "ipv6"

# iBGP Configuration (Internal BGP - Same AS Number)
bgp:
  type: "ibgp"  # Internal BGP
  asn: "65001"  # Same AS number for both DUTs
  dut1:
    router_id: "1.1.1.1"
    network: "2001:db8:20::1/64"
  dut2:
    router_id: "2.2.2.2"
    network: "2001:db8:20::2/64"
  wait_time: 90
  convergence_timeout: 90
  redistribute_connected: true

# CLI Configuration
cli:
  type: "klish"
  shell: "vtysh"

# Interface Configuration
interface:
  mtu: "9100"
  speed: "40000"

# Test Parameters
test:
  ping_count: 5
  reboot_wait_time: 60
  bgp_wait_time: 90
  interface_wait_time: 5

# Expected BGP States (for validation)
bgp_states:
  valid_states:
    - "Established"
    - "(Policy)"  # Session established but policies are applied
    - "0"  # Numeric state indicating established
    - "1"
  description: "BGP session is considered established if state is 'Established', '(Policy)', or a numeric value indicating active peering"

# Route Advertisement
routes:
  advertise_networks: true
  redistribute_connected: true
  min_routes_expected: 1
  description: "Each DUT advertises its own network and redistributes connected routes"

# Topology Information
topology:
  type: "2-node"
  description: "Two SONiC devices connected via physical Ethernet interfaces"
  dut1_port: "Ethernet32"  # Will be overridden by testbed
  dut2_port: "Ethernet32"  # Will be overridden by testbed

# Test Scenarios
scenarios:
  route_advertisement:
    description: "BGP route advertisement with network and redistribute connected"
    steps:
      - "Configure IPv6 addresses on Ethernet interfaces"
      - "Configure iBGP with same ASN (65001)"
      - "Advertise networks using 'network' command"
      - "Enable 'redistribute connected'"
      - "Verify BGP session establishment"
      - "Verify routes received using 'show bgp ipv6 unicast neighbors X routes'"
      - "Test IPv6 connectivity"

  save_reboot:
    description: "Route advertisement persistence after save and reboot"
    steps:
      - "Verify BGP session and routes before reboot"
      - "Save configuration using 'write memory'"
      - "Reboot DUTs"
      - "Verify BGP session after reboot"
      - "Verify routes still received after reboot"
      - "Verify IPv6 connectivity after reboot"

# Show Commands Used
show_commands:
  bgp_summary: "show bgp summary"
  bgp_neighbors: "show bgp ipv6 unicast neighbors"
  bgp_neighbor_routes: "show bgp ipv6 unicast neighbors <neighbor-ip> routes"
  ipv6_interfaces: "show ipv6 interfaces"
  ipv6_route: "show ipv6 route"

# Expected Route Output Format
# Example output from 'show bgp ipv6 unicast neighbors 2001:db8:20::2 routes':
# BGP table version is 4, local router ID is 192.168.100.243, vrf id 0
# Default local pref 100, local AS 65001
# Status codes: s suppressed, d damped, h history, u unsorted, * valid, > best, = multipath,
#               i internal, r RIB-failure, S Stale, R Removed
# Nexthop codes: @NNN nexthop's vrf id, < announce-nh-self
# Origin codes: i - IGP, e - EGP, ? - incomplete
# RPKI validation codes: V valid, I invalid, N Not found
#
#    Network           Next Hop                       Metric LocPrf Weight Path
# *  i 2001:db8:20::/64 fe80::2014:11ff:fe9d:57dd       0      100    0      i
#
# Displayed 1 routes and 3 total paths

# Notes
notes:
  - "This test uses iBGP (Internal BGP) with same AS number (65001) on both DUTs"
  - "Routes are advertised using both 'network' command and 'redistribute connected'"
  - "The 'network' command advertises specific prefixes"
  - "The 'redistribute connected' advertises all connected interfaces"
  - "Route verification uses 'show bgp ipv6 unicast neighbors X routes' command"
  - "Routes received from iBGP peers show 'i' flag (internal)"
  - "Test validates both route advertisement and route reception"
  - "Configuration persistence tested through save and reboot cycle"
  - "BGP validation accepts (Policy) state as valid established state"
  - "Route policies may filter prefixes, resulting in (Policy) state"

# Expected Behavior
expected:
  bgp_session_state: "Established or (Policy)"
  min_routes_received: 1
  route_flags: "i (internal)"
  ipv6_ping: "success"
  post_reboot_behavior: "All BGP routes restored automatically"

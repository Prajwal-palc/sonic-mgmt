---
# Variable file for IPv6 BGP Negative Prefix-List Test
# Test: test_ipv6_bgp_negative_prefix_list.py

# Test description
test_name: "IPv6 BGP Negative Prefix-List and Masks Test"
test_type: "negative"
protocol: "BGP"
address_family: "IPv6"

# Topology
topology_type: "2-node"
supported_platforms:
  - "HW"
  - "Virtual"

# Interface configuration
interfaces:
  dut1_ipv6: "2001:db8:1::1"
  dut2_ipv6: "2001:db8:1::2"
  ipv6_mask: "64"
  mtu: "9100"
  speed: "40000"

# BGP configuration
bgp:
  asn: "65001"
  router_id_dut1: "1.1.1.1"
  router_id_dut2: "2.2.2.2"
  address_family: "ipv6"
  session_type: "iBGP"
  bgp_wait_time: 90

# Test configuration
test_config:
  cli_type: "klish"
  ping_count: 5

# Prefix-list names
prefix_lists:
  valid_prefix_list: "VALID_IPV6_PREFIX_LIST"
  invalid_prefix_list: "INVALID_IPV6_PREFIX_LIST"

# Test networks
test_networks:
  # Valid baseline test
  valid:
    network: "2001:db8:100::/48"
    seq: 10
    action: "permit"
    description: "Valid IPv6 network with /48 mask"

  # Valid with ge/le (baseline)
  valid_with_ge_le:
    network: "1::/64"
    seq: 5
    action: "deny"
    ge: 70
    le: 80
    description: "Valid: 1::/64 ge 70 le 80 (from SONiC docs)"

  # Negative test 1: Invalid prefix length
  invalid_prefix_length:
    network: "2001:db8:200::/129"
    seq: 20
    action: "permit"
    description: "Invalid: IPv6 max prefix length is /128"
    expected_result: "rejected"

  # Negative test 2: Invalid IPv6 format
  invalid_ipv6_format:
    network: "gggg:db8:300::/64"
    seq: 30
    action: "permit"
    description: "Invalid: 'gggg' is not valid hexadecimal"
    expected_result: "rejected"

  # Negative test 3: ge less than prefix-length (Rule violation: ge must be >= prefix-length)
  invalid_ge_less_than_prefix:
    network: "2001:db8:1::/64"
    seq: 40
    action: "permit"
    ge: 60
    description: "Invalid: ge 60 < prefix-length 64 (violates ge >= prefix-length)"
    expected_result: "rejected"

  # Negative test 4: le less than ge (Rule violation: le must be >= ge)
  invalid_le_less_than_ge:
    network: "2001:db8:2::/64"
    seq: 50
    action: "permit"
    ge: 80
    le: 70
    description: "Invalid: le 70 < ge 80 (violates le >= ge)"
    expected_result: "rejected"

  # Negative test 5: ge out of range (> 128 for IPv6)
  invalid_ge_out_of_range:
    network: "2001:db8:3::/64"
    seq: 60
    action: "permit"
    ge: 129
    description: "Invalid: ge 129 exceeds maximum 128 for IPv6"
    expected_result: "rejected"

  # Negative test 6: le out of range (> 128 for IPv6)
  invalid_le_out_of_range:
    network: "2001:db8:4::/64"
    seq: 70
    action: "permit"
    ge: 80
    le: 130
    description: "Invalid: le 130 exceeds maximum 128 for IPv6"
    expected_result: "rejected"

# Expected results
expected_results:
  valid_prefix_list_accepted: true
  invalid_prefix_lists_rejected: true
  only_valid_exists: true
